function Editor({ quotationId, onExitToHome, pendingShare, onConsumePendingShare }) {
  // All default fields are empty strings – no pre-filled data
  const defaultFields = {
    quotationNo: '',
    date: '',
    clientName: '',
    siteAddress: '',
    contactNo: '',
    emailId: '',
    workDescription: '',
    total: '',
    sigName: '',
    sigMobile: ''
  };
  const defaultImages = { logo: null, signature: null, stamp: null };
  const defaultTextDefaults = { font: '"Montserrat", Arial, sans-serif', size: 12, color: '#0B2E6D', align: 'left' };

  const [fields, setFieldsRaw] = useState({ ...defaultFields });
  const [items, setItemsRaw] = useState(defaultLineItems);
  const [docType, setDocTypeRaw] = useState('quotation');
  const [images, setImagesRaw] = useState({ ...defaultImages });
  const [tableSettings, setTableSettingsRaw] = useState({ ...DEFAULT_TABLE_SETTINGS });
  const [defaults, setDefaultsRaw] = useState({ ...defaultTextDefaults });
  const [appearance, setAppearance] = useState({ dark: false });

  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfError, setPdfError] = useState('');
  const [canUndo, setCanUndo] = useState(false);
  const [canRedo, setCanRedo] = useState(false);
  const [pdfPromptOpen, setPdfPromptOpen] = useState(false);
  const [pdfPromptMode, setPdfPromptMode] = useState('download');
  const [pdfNameDraft, setPdfNameDraft] = useState('');
  const [layoutEditEnabled, setLayoutEditEnabled] = useState(false);
  const [layout, setLayoutRaw] = useState({});
  const [companyProfile, setCompanyProfile] = useState({ ...DEFAULT_COMPANY });

  const totalAutoRef = useRef(true);
  const pdfBlobRef = useRef(null);
  const pdfNameRef = useRef('Quotation.pdf');
  const saveTimerRef = useRef(null);
  const settingsOpenRef = useRef(false);
  const stateRef = useRef(null);
  const docCreatedAtRef = useRef(Date.now());

  useEffect(() => { settingsOpenRef.current = settingsOpen; }, [settingsOpen]);
  useEffect(() => { stateRef.current = { fields, items, docType, images, tableSettings, layout }; });

  /* ---------------- Undo / redo history ---------------- */
  const historyRef = useRef({ past: [], future: [] });
  const pendingBaselineRef = useRef(null);
  const debounceTimerRef = useRef(null);

  // Reads from stateRef (kept current by the effect above) rather than
  // closing over fields/items/etc directly, so functions built on top of
  // this (beginTypingEdit, commitDiscreteAction) stay correct even when
  // called from a memoized/stale closure — they always see the latest
  // document state, never a snapshot frozen at whatever render defined them.
  const snapshotDoc = () => ({ ...stateRef.current });

  const applySnapshot = (snap) => {
    setFieldsRaw(snap.fields);
    setItemsRaw(snap.items);
    setDocTypeRaw(snap.docType);
    setImagesRaw(snap.images);
    setTableSettingsRaw(snap.tableSettings);
  };

  const pushHistoryNow = (prevSnap) => {
    const h = historyRef.current;
    h.past.push(prevSnap);
    if (h.past.length > 80) h.past.shift();
    h.future = [];
    setCanUndo(true);
    setCanRedo(false);
  };

  const flushPendingBurst = () => {
    if (debounceTimerRef.current) { clearTimeout(debounceTimerRef.current); debounceTimerRef.current = null; }
    if (pendingBaselineRef.current) {
      pushHistoryNow(pendingBaselineRef.current);
      pendingBaselineRef.current = null;
    }
  };

  const beginTypingEdit = () => {
    if (!pendingBaselineRef.current) pendingBaselineRef.current = snapshotDoc();
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    debounceTimerRef.current = setTimeout(flushPendingBurst, 700);
  };

  const commitDiscreteAction = () => {
    flushPendingBurst();
    pushHistoryNow(snapshotDoc());
  };

  const undo = () => {
    flushPendingBurst();
    const h = historyRef.current;
    if (!h.past.length) return;
    const prev = h.past.pop();
    h.future.push(snapshotDoc());
    if (h.future.length > 80) h.future.shift();
    applySnapshot(prev);
    setCanUndo(h.past.length > 0);
    setCanRedo(true);
  };

  const redo = () => {
    const h = historyRef.current;
    if (!h.future.length) return;
    const next = h.future.pop();
    h.past.push(snapshotDoc());
    applySnapshot(next);
    setCanUndo(true);
    setCanRedo(h.future.length > 0);
  };

  /* ---------------- Field / doc-type / image setters ---------------- */
  const setField = (key, val) => {
    beginTypingEdit();
    setFieldsRaw((prev) => ({ ...prev, [key]: val }));
  };

  const setTotalManual = (val) => {
    totalAutoRef.current = false;
    setField('total', val);
  };

  const setDocType = (t) => {
    commitDiscreteAction();
    setDocTypeRaw(t);
  };

  const makeImageSetter = (key) => (val) => {
    beginTypingEdit();
    setImagesRaw((prev) => ({ ...prev, [key]: val }));
  };
  const setLogo = makeImageSetter('logo');
  const setSignature = makeImageSetter('signature');
  const setStamp = makeImageSetter('stamp');

  const updateTableSetting = (key, val) => {
    commitDiscreteAction();
    setTableSettingsRaw((prev) => ({ ...prev, [key]: val }));
  };

  /* ---------------- Layout Edit Mode (drag-to-reposition sections) ----------------
     Positions persist with the document (and so carry into the PDF, which
     captures the live DOM) but are intentionally kept out of the main
     Undo/Redo history to keep dragging responsive — use "Reset Layout" to
     undo a repositioning pass. */
  const setLayoutPos = (id, pos) => {
    setLayoutRaw((prev) => ({ ...prev, [id]: pos }));
  };
  // Takes the layout value explicitly (rather than reading the `layout`
  // closure) so callers that just called setLayoutRaw synchronously — like
  // resetLayout — persist the value they intended, not a stale pre-update
  // snapshot from before React re-renders.
  const persistLayout = (layoutValue) => {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const doc = { fields, items, docType, images, tableSettings, layout: layoutValue, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
      await idbSet(quotationDocKey(quotationId), doc);
      await upsertIndexEntry(quotationId, doc);
      setSaveStatus('saved');
      setLastSavedAt(Date.now());
    }, 400);
  };
  const handleLayoutMoveEnd = () => persistLayout(layout);
  const resetLayout = () => { setLayoutRaw({}); persistLayout({}); };

  /* ---------------- Row management ----------------
     Wrapped in useCallback with empty deps so their identity is stable
     across renders (they read state only via the functional setState form
     or via stateRef, never by closing over fields/items directly) — this
     lets ItemsTable's rows be memoized so editing one row of a 600-row
     quotation doesn't re-render the other 599. */
  const updateItem = useCallback((id, key, val) => {
    beginTypingEdit();
    setItemsRaw((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [key]: val };
      if (key === 'qty' || key === 'rate') {
        const q = parseFloat(String(next.qty).replace(/,/g, ''));
        const r = parseFloat(String(next.rate).replace(/,/g, ''));
        if (isFinite(q) && isFinite(r)) next.amount = String(Math.round(q * r * 100) / 100);
      }
      return next;
    }));
  }, []);

  const addRow = useCallback(() => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const nextId = prev.length ? Math.max(...prev.map((p) => p.id)) + 1 : 1;
      return [...prev, { id: nextId, description: '', unit: '', qty: '', rate: '', amount: '' }];
    });
  }, []);

  const removeRow = useCallback((id) => {
    commitDiscreteAction();
    setItemsRaw((prev) => (prev.length <= 1 ? prev : prev.filter((it) => it.id !== id)));
  }, []);

  const duplicateRow = useCallback((id) => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const idx = prev.findIndex((it) => it.id === id);
      if (idx === -1) return prev;
      const nextId = Math.max(...prev.map((p) => p.id)) + 1;
      const copy = { ...prev[idx], id: nextId };
      const next = [...prev];
      next.splice(idx + 1, 0, copy);
      return next;
    });
  }, []);

  const moveRow = useCallback((id, dir) => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const idx = prev.findIndex((it) => it.id === id);
      const newIdx = idx + dir;
      if (idx === -1 || newIdx < 0 || newIdx >= prev.length) return prev;
      const next = [...prev];
      const [moved] = next.splice(idx, 1);
      next.splice(newIdx, 0, moved);
      return next;
    });
  }, []);

  const resetAll = async () => {
    if (!window.confirm('Clear this quotation and start it blank again?')) return;
    commitDiscreteAction();
    setFieldsRaw({ ...defaultFields });
    setItemsRaw(defaultLineItems);
    setDocTypeRaw('quotation');
    setImagesRaw({ ...defaultImages });
    setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS });
    setLayoutRaw({});
    totalAutoRef.current = true;
    const doc = {
      fields: defaultFields, items: defaultLineItems, docType: 'quotation',
      images: defaultImages, tableSettings: DEFAULT_TABLE_SETTINGS, layout: {},
      updatedAt: Date.now(), createdAt: docCreatedAtRef.current
    };
    await idbSet(quotationDocKey(quotationId), doc);
    await upsertIndexEntry(quotationId, doc);
  };

  /* ---------------- Auto total (Qty × Rate sum, Indian formatting) ---------------- */
  useEffect(() => {
    if (!totalAutoRef.current) return;
    const sum = items.reduce((acc, it) => acc + (parseFloat(String(it.amount).replace(/,/g, '')) || 0), 0);
    const formatted = sum ? formatINR(sum) : '';
    setFieldsRaw((prev) => (prev.total === formatted ? prev : { ...prev, total: formatted }));
  }, [items]);

  /* ---------------- Load this quotation from IndexedDB ---------------- */
  useEffect(() => {
    let cancelled = false;
    setLoaded(false);
    (async () => {
      const doc = await idbGet(quotationDocKey(quotationId));
      if (cancelled) return;
      docCreatedAtRef.current = (doc && doc.createdAt) || Date.now();
      if (doc) {
        setFieldsRaw({ ...defaultFields, ...doc.fields });
        setItemsRaw((doc.items && doc.items.length) ? doc.items : defaultLineItems);
        setDocTypeRaw(doc.docType || 'quotation');
        setImagesRaw({ ...defaultImages, ...(doc.images || {}) });
        setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS, ...(doc.tableSettings || {}) });
        setLayoutRaw(doc.layout || {});
        totalAutoRef.current = true;
      } else {
        setFieldsRaw({ ...defaultFields });
        setItemsRaw(defaultLineItems);
        setDocTypeRaw('quotation');
        setImagesRaw({ ...defaultImages });
        setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS });
        setLayoutRaw({});
      }
      const prefs = (await idbGet(PREFS_KEY)) || loadJSON(PREFS_KEY, null);
      if (!cancelled && prefs) {
        if (prefs.defaults) setDefaultsRaw((d) => ({ ...d, ...prefs.defaults }));
        if (prefs.appearance) setAppearance((a) => ({ ...a, ...prefs.appearance }));
      }
      const savedCompany = await idbGet(COMPANY_PROFILE_KEY);
      if (!cancelled && savedCompany) setCompanyProfile((c) => ({ ...c, ...savedCompany }));
      historyRef.current = { past: [], future: [] };
      pendingBaselineRef.current = null;
      setCanUndo(false);
      setCanRedo(false);
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [quotationId]);

  useEffect(() => {
    if (!loaded || !pendingShare) return;
    onConsumePendingShare();
    handleShare();
    // eslint-disable-next-line
  }, [loaded]);

  /* ---------------- Autosave (debounced) ---------------- */
  useEffect(() => {
    if (!loaded) return;
    setSaveStatus('saving');
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const doc = { fields, items, docType, images, tableSettings, layout, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
      await idbSet(quotationDocKey(quotationId), doc);
      await upsertIndexEntry(quotationId, doc);
      setSaveStatus('saved');
      setLastSavedAt(Date.now());
    }, 600);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [fields, items, docType, images, tableSettings, loaded, quotationId]);

  useEffect(() => {
    if (!loaded) return;
    idbSet(PREFS_KEY, { defaults, appearance });
    saveJSON(PREFS_KEY, { defaults, appearance });
  }, [defaults, appearance, loaded]);

  useEffect(() => {
    document.body.classList.toggle('dark-editor', !!appearance.dark);
  }, [appearance.dark]);

  const flushSaveNow = () => {
    if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
    const s = stateRef.current;
    if (!s) return;
    const doc = { fields: s.fields, items: s.items, docType: s.docType, images: s.images, tableSettings: s.tableSettings, layout: s.layout, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
    idbSet(quotationDocKey(quotationId), doc);
    upsertIndexEntry(quotationId, doc);
    try {
      localStorage.setItem(quotationDocKey(quotationId) + '_light', JSON.stringify({ fields: s.fields, docType: s.docType, updatedAt: Date.now() }));
    } catch {}
  };

  const handleSaveNow = async () => {
    setSaveStatus('saving');
    flushSaveNow();
    await new Promise((r) => setTimeout(r, 260));
    setSaveStatus('saved');
    setLastSavedAt(Date.now());
  };

  /* ---------------- Exit protection: beforeunload / visibility / Android back ---------------- */
  useEffect(() => {
    const onBeforeUnload = () => flushSaveNow();
    const onVis = () => { if (document.hidden) flushSaveNow(); };
    window.addEventListener('beforeunload', onBeforeUnload);
    document.addEventListener('visibilitychange', onVis);

    try { window.history.pushState({ qGuard: true }, ''); } catch {}
    const onPop = () => {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
        active.blur();
        try { window.history.pushState({ qGuard: true }, ''); } catch {}
        return;
      }
      if (settingsOpenRef.current) {
        setSettingsOpen(false);
        try { window.history.pushState({ qGuard: true }, ''); } catch {}
        return;
      }
      flushSaveNow();
      onExitToHome();
    };
    window.addEventListener('popstate', onPop);

    return () => {
      window.removeEventListener('beforeunload', onBeforeUnload);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('popstate', onPop);
    };
  }, []);

  /* ---------------- Keyboard-avoidance: scroll focused field into view ---------------- */
  useEffect(() => {
    const onFocusIn = (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
        setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch {} }, 300);
      }
    };
    document.addEventListener('focusin', onFocusIn);
    return () => document.removeEventListener('focusin', onFocusIn);
  }, []);

  const handleBackTap = () => {
    flushSaveNow();
    onExitToHome();
  };

  /* ---------------- PDF generation (multi-page) + Share ---------------- */
  const generatePdf = async () => {
    const sheet = document.querySelector('.sheet');
    if (!sheet || !window.html2canvas || !window.jspdf) {
      setPdfError('PDF engine could not load. Check your connection and try again.');
      return null;
    }
    setPdfBusy(true);
    setPdfError('');
    document.body.classList.add('pdf-exporting');

    const scaleEl = document.querySelector('.sheet-scale');
    const prevZoom = scaleEl ? scaleEl.style.zoom : '';
    if (scaleEl) scaleEl.style.zoom = '1';

    const touched = [];
    const clearClip = (el) => {
      if (!el) return;
      touched.push({ el, overflow: el.style.overflow, overflowX: el.style.overflowX, overflowY: el.style.overflowY });
      el.style.overflow = 'visible';
      el.style.overflowX = 'visible';
      el.style.overflowY = 'visible';
    };
    clearClip(sheet);
    sheet.querySelectorAll('*').forEach((el) => {
      const cs = window.getComputedStyle(el);
      if (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.overflowY === 'hidden') clearClip(el);
    });

    try {
      sheet.querySelectorAll('textarea.edit-line').forEach((el) => {
        el.style.height = 'auto';
        el.style.height = Math.max(22, el.scrollHeight) + 'px';
        el.style.overflow = 'visible';
      });
      await new Promise((r) => setTimeout(r, 100));

      const CANVAS_SCALE = 2.5;
      const sheetRectCss = sheet.getBoundingClientRect();
      const sheetWidthCss = Math.ceil(sheetRectCss.width);
      const sheetHeightCss = Math.ceil(sheet.scrollHeight);

      // Measure the footer's own true rendered box (not "everything below its
      // top edge") because .sheet carries `min-height: 297mm` so short
      // documents render extra blank filler AFTER the footer, which must be
      // discarded rather than treated as part of the footer or trailing body.
      const footerElLive = sheet.querySelector('footer');
      let footerTopCss = sheetHeightCss;
      let footerBottomCss = sheetHeightCss;
      if (footerElLive) {
        const footerRect = footerElLive.getBoundingClientRect();
        footerTopCss = footerRect.top - sheetRectCss.top;
        footerBottomCss = footerRect.bottom - sheetRectCss.top;
      }
      footerTopCss = Math.min(Math.max(0, footerTopCss), sheetHeightCss);
      footerBottomCss = Math.min(Math.max(footerTopCss, footerBottomCss), sheetHeightCss);
      const bodyHeightCss = footerTopCss;
      const footerHeightCss = footerBottomCss - footerTopCss;

      // Capture the document in per-page bands rather than one giant canvas.
      // A single html2canvas call spanning hundreds of rows can exceed the
      // browser's canvas raster limits and silently return blank/corrupted
      // image data (no error thrown) — tiling keeps every captured canvas
      // at most one A4 page tall regardless of how long the document is.
      const captureBand = (yCss, hCss) => html2canvas(sheet, {
        scale: CANVAS_SCALE,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        scrollX: 0,
        scrollY: -window.scrollY,
        x: 0,
        y: yCss,
        width: sheetWidthCss,
        height: Math.max(1, Math.ceil(hCss)),
        onclone: (doc) => {
          const clonedSheet = doc.querySelector('.sheet');
          if (clonedSheet) {
            clonedSheet.style.overflow = 'visible';
            clonedSheet.style.boxShadow = 'none';
            clonedSheet.style.border = 'none';
            clonedSheet.style.transform = 'none';
          }
          const scaleClone = doc.querySelector('.sheet-scale');
          if (scaleClone) scaleClone.style.zoom = '1';

          doc.querySelectorAll('textarea.edit-line, input.edit-line').forEach((el) => {
            const div = doc.createElement('div');
            const isWhite = el.classList.contains('white-line');
            const val = el.value || '';
            div.className = el.className;
            div.textContent = val;
            div.style.cssText = [
              'display:block',
              'width:100%',
              'max-width:100%',
              'box-sizing:border-box',
              'background:transparent',
              'font-family:Montserrat,sans-serif',
              'font-size:12.5px',
              'line-height:18px',
              'color:' + (isWhite ? '#ffffff' : '#0B2E6D'),
              'border:none',
              'border-bottom:1.5px solid ' + (isWhite ? '#ffffff' : '#0B2E6D'),
              'padding:2px 4px 6px 4px',
              'margin:0',
              'min-height:22px',
              'white-space:pre-wrap',
              'word-wrap:break-word',
              'overflow-wrap:anywhere',
              'word-break:break-word',
              'overflow:visible',
              'height:auto'
            ].join(';');
            el.parentNode.replaceChild(div, el);
          });

          doc.querySelectorAll('.rich-desc').forEach((el) => {
            el.removeAttribute('data-placeholder');
            el.style.cursor = 'default';
          });

          doc.querySelectorAll('.no-print, .toolbar, .upload-btn, .img-controls, .resize-handle, .row-actions, .app-bar, .editor-toolbar, .save-status')
            .forEach((el) => { el.style.display = 'none'; });
          doc.querySelectorAll('.quote-clip').forEach((el) => {
            el.style.clipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
            el.style.webkitClipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
            el.style.backgroundColor = '#0B2E6D';
          });
          doc.querySelectorAll('.tab-clip').forEach((el) => {
            el.style.clipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
            el.style.webkitClipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
          });
          doc.querySelectorAll('.thanks-clip').forEach((el) => {
            el.style.clipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
            el.style.webkitClipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
          });
          doc.querySelectorAll('.quote-deco-line span').forEach((el) => {
            el.style.backgroundColor = '#ffffff';
            el.style.background = '#ffffff';
          });
          doc.querySelectorAll('h2').forEach((el) => {
            el.style.textDecoration = 'none';
            el.style.borderBottom = 'none';
            el.style.boxShadow = 'none';
          });
          doc.querySelectorAll('td').forEach((el) => {
            el.style.overflow = 'visible';
            el.style.wordBreak = 'break-word';
            el.style.overflowWrap = 'anywhere';
          });
        }
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });

      const pageW = 210;
      const pageH = 297;
      const margin = 1.5;
      const maxW = pageW - margin * 2;
      const maxH = pageH - margin * 2;
      const imgW = maxW;
      const pxPerMm = sheetWidthCss / pageW;

      // Slice an already-captured canvas in memory (cheap — no re-render).
      const sliceCanvas = (source, y0, y1) => {
        const c = document.createElement('canvas');
        c.width = source.width;
        c.height = y1 - y0;
        c.getContext('2d').drawImage(source, 0, y0, source.width, y1 - y0, 0, 0, source.width, y1 - y0);
        return c;
      };

      // Paginate the body (everything above the footer) across as many real
      // A4 pages as it needs, with no shrinking. Each html2canvas capture is
      // kept well under the browser's canvas raster limits (a single capture
      // spanning hundreds of rows can silently return blank/corrupted image
      // data with no error) — but capturing one page at a time is far too
      // slow for long documents (html2canvas re-clones the whole DOM on every
      // call), so each capture batches as many pages as safely fit into one
      // raster, then those pages are split apart with cheap in-memory
      // canvas cropping instead of additional html2canvas calls.
      const pageSliceCss = Math.max(1, Math.floor(maxH * pxPerMm));
      const SAFE_TILE_CANVAS_PX = 20000;
      const pagesPerTile = Math.max(1, Math.floor(SAFE_TILE_CANVAS_PX / (CANVAS_SCALE * pageSliceCss)));
      const tileCssHeight = pagesPerTile * pageSliceCss;

      let renderedY = 0;
      let pagesDrawn = 0;
      let lastSliceHmm = 0;
      let fitRatio = null;
      while (renderedY < bodyHeightCss) {
        const tileH = Math.min(tileCssHeight, bodyHeightCss - renderedY);
        const tileCanvas = await captureBand(renderedY, tileH);
        if (fitRatio === null) fitRatio = maxW / tileCanvas.width;
        const pageSliceCanvasPx = Math.max(1, Math.round(pageSliceCss * (tileCanvas.width / sheetWidthCss)));
        let ty = 0;
        while (ty < tileCanvas.height) {
          const sh = Math.min(pageSliceCanvasPx, tileCanvas.height - ty);
          const pageCanvas = sliceCanvas(tileCanvas, ty, ty + sh);
          const sliceData = pageCanvas.toDataURL('image/jpeg', 0.98);
          const sliceHmm = pageCanvas.height * fitRatio;
          if (pagesDrawn > 0) pdf.addPage();
          pdf.addImage(sliceData, 'JPEG', (pageW - imgW) / 2, margin, imgW, sliceHmm, undefined, 'MEDIUM');
          lastSliceHmm = sliceHmm;
          ty += sh;
          pagesDrawn++;
        }
        renderedY += tileH;
      }

      // Capture the footer on its own (small, fixed-size) band — it must
      // always sit flush with the bottom edge of the FINAL PDF page, no
      // matter how many pages the body spans. We can't rely on CSS
      // ("position: fixed; bottom: 0") because each page is a separate
      // raster image — instead we place the footer image explicitly,
      // bottom-anchored, after we know what the last body page contains.
      let footerCanvas = null;
      if (footerHeightCss > 0) {
        footerCanvas = await captureBand(footerTopCss, footerHeightCss);
        if (fitRatio === null) fitRatio = maxW / footerCanvas.width;
      }
      const footerHeightMm = footerCanvas ? footerCanvas.height * fitRatio : 0;

      // Place the footer, bottom-anchored, on the last page if it fits there
      // alongside the body content already drawn — otherwise give it its own
      // fresh page (still bottom-anchored, blank space above rather than below).
      if (footerCanvas) {
        const fitsOnLastPage = pagesDrawn > 0 && lastSliceHmm + footerHeightMm <= maxH;
        if (pagesDrawn > 0 && !fitsOnLastPage) pdf.addPage();
        const footerY = margin + maxH - footerHeightMm;
        const footerData = footerCanvas.toDataURL('image/jpeg', 0.98);
        pdf.addImage(footerData, 'JPEG', (pageW - imgW) / 2, footerY, imgW, footerHeightMm, undefined, 'MEDIUM');
      }

      const titleEl = sheet.querySelector('h2');
      const name = (titleEl && titleEl.textContent) || 'Quotation';
      const fileName = name.trim().replace(/\s+/g, '_') + '.pdf';
      const blob = pdf.output('blob');
      pdfBlobRef.current = blob;
      pdfNameRef.current = fileName;
      return { blob, fileName, pdf };
    } catch (err) {
      console.error(err);
      setPdfError('PDF generation failed. Please try again.');
      return null;
    } finally {
      if (scaleEl) scaleEl.style.zoom = prevZoom;
      touched.forEach(({ el, overflow, overflowX, overflowY }) => {
        el.style.overflow = overflow;
        el.style.overflowX = overflowX;
        el.style.overflowY = overflowY;
      });
      document.body.classList.remove('pdf-exporting');
      setPdfBusy(false);
    }
  };

  const handleDownloadPdf = async (overrideName) => {
    const result = await generatePdf();
    if (result) {
      const fname = overrideName || result.fileName;
      pdfNameRef.current = fname;
      result.pdf.save(fname);
    }
  };

  const handleShare = async (overrideName) => {
    if (!pdfBlobRef.current) await generatePdf();
    const blob = pdfBlobRef.current;
    const fileName = overrideName || pdfNameRef.current;
    if (overrideName) pdfNameRef.current = overrideName;
    if (!blob) return;
    try {
      const file = new File([blob], fileName, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
    // Fallback: no native share support — download the PDF instead.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  const defaultPdfFileName = () => {
    const fmt = defaults.pdfFormat || 'number_client';
    const parts = [];
    const wantNumber = fmt === 'number_client' || fmt === 'number';
    const wantClient = fmt === 'number_client' || fmt === 'client';
    if (wantNumber && fields.quotationNo) parts.push(('Quotation_' + fields.quotationNo).replace(/\s+/g, '_'));
    if (wantClient && fields.clientName) parts.push(fields.clientName.trim().replace(/\s+/g, '_'));
    if (!parts.length) parts.push(docType === 'bill' ? 'Bill' : 'Quotation');
    return parts.join('_');
  };

  const openPdfPrompt = (mode) => {
    setPdfPromptMode(mode);
    setPdfNameDraft(defaultPdfFileName());
    setPdfPromptOpen(true);
  };

  const confirmPdfPrompt = () => {
    const name = (pdfNameDraft || defaultPdfFileName()).trim().replace(/\.pdf$/i, '') + '.pdf';
    setPdfPromptOpen(false);
    if (pdfPromptMode === 'share') handleShare(name);
    else handleDownloadPdf(name);
  };

  return (
    <>
      <TopAppBar
        title={docType === 'bill' ? 'New Bill' : 'New Quotation'}
        onBack={handleBackTap}
        onSave={handleSaveNow}
        saveStatus={saveStatus}
        lastSavedAt={lastSavedAt}
      />
      <EditorToolbar
        onUndo={undo}
        onRedo={redo}
        canUndo={canUndo}
        canRedo={canRedo}
        onAddRow={addRow}
        onSave={handleSaveNow}
        onPdf={() => openPdfPrompt('download')}
        onShare={() => openPdfPrompt('share')}
        onSettings={() => setSettingsOpen(true)}
        pdfBusy={pdfBusy}
      />

      {pdfPromptOpen && (
        <div className="modal-overlay no-print" onClick={() => setPdfPromptOpen(false)}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>{pdfPromptMode === 'share' ? 'Share PDF' : 'Save PDF'}</h3>
              <button type="button" className="icon-btn ripple-surface" onClick={() => setPdfPromptOpen(false)}><IconClose className="h-[18px] w-[18px]" /></button>
            </div>
            <div className="modal-body">
              <label style={{ fontSize: 12, fontWeight: 700, color: '#0B2E6D', fontFamily: 'Montserrat, sans-serif' }}>File name</label>
              <input
                type="text"
                value={pdfNameDraft}
                onChange={(e) => setPdfNameDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') confirmPdfPrompt(); }}
                autoFocus
                style={{ width: '100%', marginTop: 6, padding: '10px 12px', border: '1px solid #d3dbe8', borderRadius: 8, fontSize: 14, fontFamily: 'Montserrat, sans-serif', color: '#0B2E6D', boxSizing: 'border-box' }}
              />
              <div style={{ display: 'flex', gap: 14, marginTop: 16 }}>
                <button type="button" className="upload-btn" onClick={confirmPdfPrompt} style={{ fontWeight: 700 }}>
                  {pdfPromptMode === 'share' ? 'Share' : 'Download PDF'}
                </button>
                <button type="button" className="upload-btn" onClick={() => setPdfPromptOpen(false)}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {pdfError && (
        <div className="modal-overlay no-print" onClick={() => setPdfError('')}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>PDF Generation Failed</h3>
              <button type="button" className="icon-btn ripple-surface" onClick={() => setPdfError('')}><IconClose className="h-[18px] w-[18px]" /></button>
            </div>
            <div className="modal-body">
              <p style={{ fontFamily: 'Montserrat, sans-serif', fontSize: 13, color: '#333', margin: 0 }}>{pdfError}</p>
              <div style={{ display: 'flex', gap: 14, marginTop: 16 }}>
                <button type="button" className="upload-btn" onClick={() => { setPdfError(''); handleDownloadPdf(); }}>Retry</button>
                <button type="button" className="upload-btn" onClick={() => setPdfError('')}>Dismiss</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <SettingsPanel
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        tableSettings={tableSettings}
        onToggleTable={updateTableSetting}
        appearance={appearance}
        setAppearance={setAppearance}
        defaults={defaults}
        setDefaults={setDefaultsRaw}
        onResetAll={() => { setSettingsOpen(false); resetAll(); }}
        layoutEditEnabled={layoutEditEnabled}
        onToggleLayoutEdit={setLayoutEditEnabled}
        onResetLayout={resetLayout}
      />

      <div className="sheet-wrap min-h-full w-full">
        <div className="sheet-scale">
          <main className="sheet flex flex-col overflow-hidden border border-navy/20 shadow-sheet">
            <LayoutSection id="header" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Header">
              <QuotationHeader fields={fields} setField={setField} docType={docType} setDocType={setDocType} logo={images.logo} setLogo={setLogo} company={companyProfile} />
            </LayoutSection>
            <LayoutSection id="details" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Customer & Work Details">
              <DetailsSection fields={fields} setField={setField} />
            </LayoutSection>
            <LayoutSection id="scope" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Scope of Work">
              <ScopeOfWork />
            </LayoutSection>
            <LayoutSection id="table" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Items Table">
              <ItemsTable
                items={items}
                tableSettings={tableSettings}
                defaults={defaults}
                onUpdateItem={updateItem}
                onAddRow={addRow}
                onRemoveRow={removeRow}
                onDuplicateRow={duplicateRow}
                onMoveRow={moveRow}
                total={fields.total}
                onTotalChange={setTotalManual}
              />
            </LayoutSection>
            <LayoutSection id="terms" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Terms, Signature & Stamp">
              <TermsAndSignature
                fields={fields}
                setField={setField}
                signature={images.signature}
                setSignature={setSignature}
                stamp={images.stamp}
                setStamp={setStamp}
              />
            </LayoutSection>
            <LayoutSection id="footer" editEnabled={layoutEditEnabled} layout={layout} onMove={setLayoutPos} onMoveEnd={handleLayoutMoveEnd} label="Footer">
              <FooterBar />
            </LayoutSection>
          </main>
        </div>
      </div>
    </>
  );
}

    <div className="qcard ripple-surface" onClick={() => onOpen(q.id)}>
      <div className="qcard-top">
        <div className="qcard-name">{q.name || 'Untitled Quotation'}</div>
        <div className="qcard-badge">{q.docType === 'bill' ? 'BILL' : 'QUOTATION'}</div>
      </div>
      <div className="qcard-meta">
        {q.quotationNo && <span>No. {q.quotationNo}</span>}
        {q.clientName && <span>{q.clientName}</span>}
        {q.date && <span>{q.date}</span>}
      </div>
      <div className="qcard-bottom">
        <div className="qcard-total">{q.total ? `₹${q.total}` : ''}</div>
        <div className="qcard-actions" onClick={(e) => e.stopPropagation()}>
          <button type="button" className="qcard-act" title="Duplicate" onClick={() => onDuplicate(q.id)}><IconDuplicate className="h-[15px] w-[15px]" /></button>
          <button type="button" className="qcard-act" title="Share PDF" onClick={() => onShare(q.id)}><IconShare className="h-[15px] w-[15px]" /></button>
          <button type="button" className="qcard-act qcard-act-danger" title="Delete" onClick={() => onDelete(q.id)}><IconTrash className="h-[15px] w-[15px]" /></button>
        </div>
      </div>
    </div>
  );
}

function CompanyProfileModal({ open, onClose, company, onSave }) {
  const [draft, setDraft] = useState(company);
  useEffect(() => { if (open) setDraft(company); }, [open, company]);
  if (!open) return null;
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));
  return (
    <div className="modal-overlay no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-header">
          <h3>Edit Company Profile</h3>
          <button type="button" className="icon-btn ripple-surface" onClick={onClose} title="Close"><IconClose className="h-[18px] w-[18px]" /></button>
        </div>
        <div className="modal-body">

function DataPanel({ open, onClose }) {
  const [status, setStatus] = useState('');
  if (!open) return null;

  const handleBackup = async () => {
    setStatus('Preparing backup…');
    try {
      const index = await loadQuotationIndex();
      const docs = {};
      for (const q of index) {
        docs[q.id] = await idbGet(quotationDocKey(q.id));
      }
      const payload = { exportedAt: Date.now(), index, docs };
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'quotation_app_backup_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setStatus('Backup downloaded ✓');
    } catch (e) {
      setStatus('Backup failed. Please try again.');
    }
  };

  const handleRestoreFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setStatus('Restoring…');
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload || !payload.docs) throw new Error('invalid file');
        for (const id of Object.keys(payload.docs)) {
          await idbSet(quotationDocKey(id), payload.docs[id]);
        }
        await queueIndexOp(async () => {
          const existing = await loadQuotationIndex();
          const byId = {};
          existing.forEach((q) => { byId[q.id] = q; });
          for (const id of Object.keys(payload.docs)) {
            byId[id] = summarizeDoc(id, payload.docs[id]);
          }
          await saveQuotationIndex(Object.values(byId));
        });
        setStatus('Restore complete ✓ — go back to Home to see it.');
      } catch (err) {
        setStatus('That file could not be read as a backup.');
      }
    };
    reader.onerror = () => setStatus('Could not read that file.');
    reader.readAsText(file);
  };

  const handleClearAll = async () => {
    if (!window.confirm('Delete ALL quotations from this device? This cannot be undone.')) return;
    const index = await loadQuotationIndex();
    for (const q of index) await idbDelete(quotationDocKey(q.id));
    await queueIndexOp(() => saveQuotationIndex([]));
    setStatus('All quotations cleared.');
  };

  return (
    <div className="modal-overlay no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-header">
          <h3>Backup &amp; Data</h3>
          <button type="button" className="icon-btn ripple-surface" onClick={onClose} title="Close"><IconClose className="h-[18px] w-[18px]" /></button>
        </div>
        <div className="modal-body">
          <div className="settings-group">
            <h4>Backup</h4>
            <p style={{ fontSize: 12.5, color: '#667085', fontFamily: 'Montserrat, sans-serif', margin: '0 0 10px' }}>
              Download every saved quotation as a single JSON file you can keep safe or move to another device.
            </p>
            <button type="button" className="upload-btn" onClick={handleBackup}>Backup All Quotations</button>
          </div>
          <div className="settings-group">
            <h4>Restore</h4>
            <p style={{ fontSize: 12.5, color: '#667085', fontFamily: 'Montserrat, sans-serif', margin: '0 0 10px' }}>
              Restore quotations from a backup file. Existing quotations with the same ID are overwritten; everything else is kept.
            </p>
            <label className="upload-btn" style={{ cursor: 'pointer' }}>
              Choose Backup File…
              <input type="file" accept="application/json" style={{ display: 'none' }} onChange={handleRestoreFile} />
            </label>
          </div>
          <div className="settings-group">
            <h4>Clear Data</h4>
            <button type="button" className="upload-btn" style={{ color: '#D32F2F' }} onClick={handleClearAll}>Delete All Quotations</button>
          </div>
          {status && <p style={{ fontSize: 12.5, color: '#0B2E6D', fontWeight: 600, fontFamily: 'Montserrat, sans-serif' }}>{status}</p>}
        </div>
      </div>
    </div>
  );
}

function QuotationListScreen({ variant, onOpen, onCreate, onShare }) {
  const isWP = variant === 'waterproofing';
  const [index, setIndex] = useState(null);
  const [search, setSearch] = useState('');
  const [deleteTarget, setDeleteTarget] = useState(null);
  const creatingRef = useRef(false);

  const refresh = async () => {
    const list = await loadQuotationIndex();
    list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    setIndex(list);
  };

  useEffect(() => { refresh(); }, []);

  const filtered = (index || []).filter((q) => {
    const s = search.trim().toLowerCase();
    if (!s) return true;
    return (q.name || '').toLowerCase().includes(s) ||
      (q.quotationNo || '').toLowerCase().includes(s) ||
      (q.clientName || '').toLowerCase().includes(s);
  });

  // Guarded against rapid double-taps: each call genuinely mints a new
  // quotation id, so an accidental second tap before the first navigation
  // completes would otherwise create two records from one intended tap.
  const handleCreate = async () => {
    if (creatingRef.current) return;
    creatingRef.current = true;
    try {
      const id = await createNewQuotation();
      onCreate(id);
    } finally {
      creatingRef.current = false;
    }
  };

  const handleDuplicate = async (id) => {
    await duplicateQuotationRecord(id);
    await refresh();
  };

  const handleDeleteConfirmed = async () => {
    if (!deleteTarget) return;
    await deleteQuotationRecord(deleteTarget);
    setDeleteTarget(null);
    await refresh();
  };

  const createLabel = isWP ? 'New Waterproofing Quotation' : 'Create New Quotation';

  return (
    <div className="home-screen">
      <div className="home-header">
        <div>
          <div className="home-title">{isWP ? 'WATERPROOFING' : 'QUOTATION APP'}</div>
          <div className="home-subtitle">{isWP ? 'Waterproofing quotations & bills' : 'Professional Quotation & Bill Maker'}</div>
        </div>
      </div>

      <div className="home-search-wrap">
        <div className="home-search">
          <IconSvg d="m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" className="h-[16px] w-[16px] text-slate-400" />
          <input
            type="text"
            placeholder="Search by name, number or client…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
      </div>

      {(!isWP || index === null || filtered.length > 0 || search.trim()) && (
        <div className="home-create-wrap">
          <button type="button" className="home-create-btn ripple-surface" onClick={handleCreate}>
            <IconAddRow className="h-[18px] w-[18px]" />
            {createLabel}
          </button>
        </div>
      )}

      {index !== null && filtered.length > 0 && (
        <div className="home-section-label">
          {search.trim() ? `Results (${filtered.length})` : `Your Quotations (${filtered.length})`}
        </div>
      )}

      {index === null ? (
        <div className="home-empty">Loading…</div>
      ) : filtered.length === 0 ? (
        <div className="home-empty">
          <div className="home-empty-icon">{isWP ? '💧' : '📄'}</div>
          {isWP && !search.trim() ? (
            <>
              <p style={{ fontWeight: 700, color: '#1d2939', fontSize: 14, margin: '0 0 4px' }}>No Waterproofing Quotations</p>
              <p style={{ margin: '0 0 16px' }}>Create your first waterproofing quotation</p>
              <button type="button" className="home-create-btn ripple-surface" style={{ maxWidth: 280, margin: '0 auto' }} onClick={handleCreate}>
                <IconAddRow className="h-[16px] w-[16px]" />
                {createLabel}
              </button>
            </>
          ) : (
            search.trim() ? 'No quotations match your search.' : 'No quotations yet. Tap "Create New Quotation" to get started.'
          )}
        </div>
      ) : (
        <div className="home-card-list">
          {filtered.map((q) => (
            <QuotationCard
              key={q.id}
              q={q}
              onOpen={onOpen}
              onDuplicate={handleDuplicate}
              onDelete={(id) => setDeleteTarget(id)}
              onShare={onShare}
            />
          ))}
        </div>
      )}

      {deleteTarget && (
        <div className="modal-overlay no-print" onClick={() => setDeleteTarget(null)}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 340 }}>
            <div className="modal-header">
              <h3>Delete this quotation?</h3>
            </div>
            <div className="modal-body">
              <p style={{ fontSize: 13, color: '#333', fontFamily: 'Montserrat, sans-serif', margin: '0 0 16px' }}>
                This can't be undone.
              </p>
              <div style={{ display: 'flex', gap: 12 }}>
                <button type="button" className="upload-btn" style={{ color: '#D32F2F', fontWeight: 700 }} onClick={handleDeleteConfirmed}>Delete</button>
                <button type="button" className="upload-btn" onClick={() => setDeleteTarget(null)}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Root() {
  const [ready, setReady] = useState(false);
  const [activeTab, setActiveTab] = useState('home');
  const [inEditor, setInEditor] = useState(false);
  const [activeId, setActiveId] = useState(null);
  const [pendingShare, setPendingShare] = useState(false);

  useEffect(() => {
    (async () => {
      await migrateLegacyDraftIfNeeded();
      setReady(true);
      if (window.__hideSplashWhenReady) window.__hideSplashWhenReady();
    })();
  }, []);

  // Returning from the editor goes back to whichever tab (Home or
  // Waterproofing) the user opened it from, not always Home.
  const exitEditor = () => { setInEditor(false); setActiveId(null); setPendingShare(false); };
  const openQuotation = (id) => { setActiveId(id); setPendingShare(false); setInEditor(true); };
  const createQuotation = (id) => { setActiveId(id); setPendingShare(false); setInEditor(true); };
  const shareQuotation = (id) => { setActiveId(id); setPendingShare(true); setInEditor(true); };

  if (!ready) return null;

  if (inEditor && activeId) {
    return (
      <Editor
        key={activeId}
        quotationId={activeId}
        onExitToHome={exitEditor}
        pendingShare={pendingShare}
        onConsumePendingShare={() => setPendingShare(false)}
      />
    );
  }

  return (
    <>
      {activeTab === 'home' && <QuotationListScreen variant="home" onOpen={openQuotation} onCreate={createQuotation} onShare={shareQuotation} />}
      {activeTab === 'waterproofing' && <QuotationListScreen variant="waterproofing" onOpen={openQuotation} onCreate={createQuotation} onShare={shareQuotation} />}
      {activeTab === 'settings' && <SettingsScreen />}
      <BottomNav activeTab={activeTab} onNavigate={setActiveTab} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
