    /* ===================== Description rich-text editor ===================== */
    /* Professional app-style text-color picker (Material grid / custom HSV
       picker with hue+opacity sliders+RGB / Clear), replacing the OS-native
       <input type="color"> dialog. Only produces a color value via onApply —
       it never touches the editor's selection or background itself; that's
       still handled entirely by DescToolbar's onColor (execCommand
       'foreColor', i.e. text color only), unchanged. */
    function ColorPickerModal({ initialColor, onApply, onClose }) {
      const [tab, setTab] = useState('material');
      const initRgb = hexToRgb(initialColor) || hexToRgb(DEFAULT_TEXT_COLOR);
      const initHsv = rgbToHsv(initRgb.r, initRgb.g, initRgb.b);
      const [hue, setHue] = useState(initHsv.h);
      const [sat, setSat] = useState(initHsv.s);
      const [val, setVal] = useState(initHsv.v);
      const [opacity, setOpacity] = useState(100);

      const rgb = hsvToRgb(hue, sat, val);
      const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      const previewColor = opacity < 100
        ? `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${(opacity / 100).toFixed(2)})`
        : hex;

      const svRef = useRef(null);
      const hueRef = useRef(null);
      const opRef = useRef(null);

      const dragFrom = (ref, onMove) => (e) => {
        e.preventDefault();
        const el = ref.current;
        if (!el) return;
        try { el.setPointerCapture(e.pointerId); } catch {}
        const move = (ev) => {
          const rect = el.getBoundingClientRect();
          const x = Math.min(Math.max(0, ev.clientX - rect.left), rect.width);
          const y = Math.min(Math.max(0, ev.clientY - rect.top), rect.height);
          onMove(x, rect.width, y, rect.height);
        };
        move(e);
        const onUp = () => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onUp);
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onUp);
      };

      const onSvDown = dragFrom(svRef, (x, w, y, h) => {
        setSat(x / w);
        setVal(1 - y / h);
      });
      const onHueDown = dragFrom(hueRef, (x, w) => setHue((x / w) * 360));
      const onOpacityDown = dragFrom(opRef, (x, w) => setOpacity(Math.round((x / w) * 100)));

      const applyRgbField = (channel, raw) => {
        const n = Math.max(0, Math.min(255, Math.round(Number(raw)) || 0));
        const nextRgb = { ...rgb, [channel]: n };
        const hsv = rgbToHsv(nextRgb.r, nextRgb.g, nextRgb.b);
        setHue(hsv.h); setSat(hsv.s); setVal(hsv.v);
      };

      const pickMaterial = (c) => {
        const mrgb = hexToRgb(c);
        const hsv = rgbToHsv(mrgb.r, mrgb.g, mrgb.b);
        setHue(hsv.h); setSat(hsv.s); setVal(hsv.v);
        setOpacity(100);
        setTab('color');
      };

      const handleOk = () => { onApply(previewColor); onClose(); };
      const handleClear = () => { onApply(DEFAULT_TEXT_COLOR); onClose(); };

      return (
        <div className="modal-overlay no-print cp-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal-sheet cp-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Select Color</h3>
              <button type="button" className="icon-btn ripple-surface" onClick={onClose}><IconClose className="h-[18px] w-[18px]" /></button>
            </div>
            <div className="cp-tabs">
              <button type="button" className={`cp-tab ${tab === 'material' ? 'active' : ''}`} onClick={() => setTab('material')}>Material</button>
              <button type="button" className={`cp-tab ${tab === 'color' ? 'active' : ''}`} onClick={() => setTab('color')}>Color</button>
              <button type="button" className={`cp-tab ${tab === 'clear' ? 'active' : ''}`} onClick={() => setTab('clear')}>Clear</button>
            </div>
            <div className="cp-body">
              {tab === 'material' && (
                <div className="cp-material-grid">
                  {MATERIAL_COLORS.map((c) => (
                    <button key={c} type="button" className="cp-material-swatch" style={{ background: c }} title={c} onClick={() => pickMaterial(c)} />
                  ))}
                </div>
              )}
              {tab === 'color' && (
                <div className="cp-custom">
                  <div
                    ref={svRef}
                    className="cp-sv-box"
                    style={{ background: `hsl(${hue}, 100%, 50%)` }}
                    onPointerDown={onSvDown}
                  >
                    <div className="cp-sv-white-overlay" />
                    <div className="cp-sv-black-overlay" />
                    <div className="cp-sv-thumb" style={{ left: (sat * 100) + '%', top: ((1 - val) * 100) + '%' }} />
                  </div>
                  <div ref={hueRef} className="cp-hue-slider" onPointerDown={onHueDown}>
                    <div className="cp-hue-thumb" style={{ left: (hue / 360 * 100) + '%' }} />
                  </div>
                  <div ref={opRef} className="cp-opacity-slider" style={{ '--cp-op-color': hex }} onPointerDown={onOpacityDown}>
                    <div className="cp-opacity-thumb" style={{ left: opacity + '%' }} />
                  </div>
                  <div className="cp-rgb-row">
                    <label className="cp-rgb-field">
                      <span>R</span>
                      <input type="number" min="0" max="255" value={rgb.r} onChange={(e) => applyRgbField('r', e.target.value)} />
                    </label>
                    <label className="cp-rgb-field">
                      <span>G</span>
                      <input type="number" min="0" max="255" value={rgb.g} onChange={(e) => applyRgbField('g', e.target.value)} />
                    </label>
                    <label className="cp-rgb-field">
                      <span>B</span>
                      <input type="number" min="0" max="255" value={rgb.b} onChange={(e) => applyRgbField('b', e.target.value)} />
                    </label>
                  </div>
                </div>
              )}
              {tab === 'clear' && (
                <div className="cp-clear-panel">
                  <p>Remove the custom text color from the current selection and use the default document color instead.</p>
                  <button type="button" className="cp-clear-btn" onClick={handleClear}>Clear Color</button>
                </div>
              )}
            </div>
            {tab !== 'clear' && (
              <div className="cp-footer">
                <div className="cp-preview-swatch" style={{ background: previewColor }} />
                <div className="cp-preview-info">
                  <div className="cp-preview-hex">{hex.toUpperCase()}</div>
                  <div className="cp-preview-rgb">RGB {rgb.r}, {rgb.g}, {rgb.b}{opacity < 100 ? ` · ${opacity}%` : ''}</div>
                </div>
                <button type="button" className="cp-ok-btn" onClick={handleOk}>OK</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DescToolbar({ onCmd, onFont, onSize, onColor, activeFormats, onClose }) {
      const [fontOpen, setFontOpen] = useState(false);
      const [sizeOpen, setSizeOpen] = useState(false);
      const [colorModalOpen, setColorModalOpen] = useState(false);
      const [sizeInput, setSizeInput] = useState(12);

      // Prevents the browser's default mousedown action (which would shift
      // focus off the description field and collapse the text selection)
      // while still letting the click/onClick handler run normally. This is
      // the standard technique rich-text toolbars use so a tap on a button
      // never loses the user's selection.
      const noSteal = (e) => e.preventDefault();

      const closeAllPopups = () => { setFontOpen(false); setSizeOpen(false); };

      const applySize = (v) => {
        const n = Math.round(Number(v));
        if (n >= 8 && n <= 21) { onSize(n); closeAllPopups(); }
      };

      return (
        <div className="desc-toolbar-wrap no-print">
          <div className="desc-toolbar-row">
            <button type="button" className="dt-close-btn" onMouseDown={noSteal} onClick={onClose} title="Close formatting">
              <IconBack className="h-[14px] w-[14px]" />
            </button>
            <div className="dt-dropdown">
              <button
                type="button"
                className="dt-dd-btn"
                onMouseDown={noSteal}
                onClick={() => { setFontOpen((v) => !v); setSizeOpen(false); }}
              >
                Font <span className="dt-caret">▾</span>
              </button>
              {fontOpen && (
                <div className="dt-dd-list" onMouseDown={noSteal}>
                  {FONT_FAMILIES.map((f) => (
                    <button type="button" key={f.label} style={{ fontFamily: f.value }} onClick={() => { onFont(f.value); closeAllPopups(); }}>
                      {f.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div className="dt-dropdown">
              <button
                type="button"
                className="dt-dd-btn"
                onMouseDown={noSteal}
                onClick={() => { setSizeOpen((v) => !v); setFontOpen(false); }}
              >
                Size <span className="dt-caret">▾</span>
              </button>
              {sizeOpen && (
                <div className="dt-dd-list dt-dd-list-size" onMouseDown={noSteal}>
                  {FONT_SIZES.map((s) => (
                    <button type="button" key={s} onClick={() => { onSize(s); closeAllPopups(); }}>{s} pt</button>
                  ))}
                  <div className="dt-dd-custom">
                    <input
                      type="number"
                      className="dt-num"
                      min={8}
                      max={21}
                      value={sizeInput}
                      onChange={(e) => setSizeInput(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') applySize(sizeInput); }}
                    />
                    <span>pt</span>
                    <button type="button" className="dt-close-btn" style={{ marginLeft: 'auto' }} onClick={() => applySize(sizeInput)}>Set</button>
                  </div>
                </div>
              )}
            </div>
          </div>
          <div className="desc-toolbar-row">
            <button type="button" className={`dt-btn ${activeFormats.bold ? 'on' : ''}`} onMouseDown={noSteal} onClick={() => onCmd('bold')} title="Bold">
              <IconBold className="h-[14px] w-[14px]" />
            </button>
            <button type="button" className={`dt-btn ${activeFormats.italic ? 'on' : ''}`} onMouseDown={noSteal} onClick={() => onCmd('italic')} title="Italic">
              <IconItalic className="h-[14px] w-[14px]" />
            </button>
            <button type="button" className={`dt-btn ${activeFormats.underline ? 'on' : ''}`} onMouseDown={noSteal} onClick={() => onCmd('underline')} title="Underline">
              <IconUnderline className="h-[14px] w-[14px]" />
            </button>
            <div className="dt-dropdown" style={{ flex: '0 0 auto' }}>
              <button
                type="button"
                className="dt-btn"
                onMouseDown={noSteal}
                onClick={() => { setColorModalOpen(true); setFontOpen(false); setSizeOpen(false); }}
                title="Text color"
              >
                <IconPalette className="h-[14px] w-[14px]" />
              </button>
            </div>
          </div>
          {colorModalOpen && (
            <ColorPickerModal
              initialColor={DEFAULT_TEXT_COLOR}
              onApply={onColor}
              onClose={() => setColorModalOpen(false)}
            />
          )}
        </div>
      );
    }

    function RichDescriptionEditor({ value, onChange, placeholder, defaultStyle, className = '' }) {
      const ref = useRef(null);
      const containerRef = useRef(null);
      const [active, setActive] = useState(false);
      const [activeFormats, setActiveFormats] = useState({});
      const blurTimeout = useRef(null);
      const savedRangeRef = useRef(null);

      useEffect(() => {
        if (ref.current && document.activeElement !== ref.current && ref.current.innerHTML !== (value || '')) {
          ref.current.innerHTML = value || '';
        }
      }, [value]);

      const emitChange = () => {
        if (ref.current) onChange(ref.current.innerHTML);
      };

      // Continuously remember the caret/selection while the field itself is
      // focused, so we can restore it after focus is (unavoidably) stolen by
      // a native control like the color <input>.
      const captureSelection = () => {
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && ref.current && ref.current.contains(sel.anchorNode)) {
          savedRangeRef.current = sel.getRangeAt(0).cloneRange();
        }
      };

      const refreshFormatState = () => {
        try {
          setActiveFormats({
            bold: document.queryCommandState('bold'),
            italic: document.queryCommandState('italic'),
            underline: document.queryCommandState('underline')
          });
        } catch {}
      };

      const restoreSelection = () => {
        if (!ref.current) return;
        ref.current.focus();
        if (savedRangeRef.current) {
          try {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRangeRef.current);
          } catch {}
        }
      };

      const withSelection = (fn) => {
        restoreSelection();
        fn();
        captureSelection();
        emitChange();
        refreshFormatState();
      };

      const onCmd = (cmd) => withSelection(() => {
        try { document.execCommand('styleWithCSS', false, true); document.execCommand(cmd, false, null); } catch {}
      });
      const onFont = (fontValue) => withSelection(() => {
        try { document.execCommand('styleWithCSS', false, true); document.execCommand('fontName', false, fontValue); } catch {}
      });
      const onColor = (hex) => withSelection(() => {
        try { document.execCommand('styleWithCSS', false, true); document.execCommand('foreColor', false, hex); } catch {}
      });
      const onSize = (px) => withSelection(() => {
        try {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && sel.isCollapsed) {
            // No text is selected yet (e.g. the field is still empty, or the
            // user picked a size before typing). execCommand('fontSize') has
            // no arbitrary-px form, so on a collapsed caret it can only mark
            // the browser's internal "typing style" as legacy size 7
            // (xxx-large, ~48px) with nothing yet in the DOM to fix up
            // afterwards — any text then typed inherits that huge size
            // regardless of which pt was picked. Instead, insert an empty
            // span carrying the real px size and place the caret inside it,
            // so subsequently typed text picks up the correct size directly.
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = px + 'px';
            span.appendChild(document.createTextNode('​'));
            range.insertNode(span);
            const newRange = document.createRange();
            newRange.setStart(span.firstChild, 1);
            newRange.setEnd(span.firstChild, 1);
            sel.removeAllRanges();
            sel.addRange(newRange);
            savedRangeRef.current = newRange.cloneRange();
            return;
          }
          // styleWithCSS must be OFF for this one command: with it on, Chrome
          // writes `font-size: xxx-large` (the CSS keyword for legacy size 7)
          // as inline CSS instead of a <font size="7"> element, so the
          // find-and-replace below would never match anything and the actual
          // pixel size we want never gets applied.
          document.execCommand('styleWithCSS', false, false);
          document.execCommand('fontSize', false, '7');
          if (ref.current) {
            ref.current.querySelectorAll('font[size="7"]').forEach((el) => {
              el.removeAttribute('size');
              el.style.fontSize = px + 'px';
            });
          }
        } catch {}
      });

      const closeToolbar = () => {
        setActive(false);
        if (ref.current) ref.current.blur();
      };

      useEffect(() => {
        if (active && containerRef.current) {
          const t = setTimeout(() => {
            try { containerRef.current.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch {}
          }, 80);
          return () => clearTimeout(t);
        }
      }, [active]);

      return (
        <div
          ref={containerRef}
          onFocus={() => {
            if (blurTimeout.current) { clearTimeout(blurTimeout.current); blurTimeout.current = null; }
            setActive(true);
          }}
          onBlur={(e) => {
            // Focus moving to a control still inside this editor (a toolbar
            // button/dropdown/color input) must not hide the toolbar.
            if (containerRef.current && e.relatedTarget && containerRef.current.contains(e.relatedTarget)) return;
            blurTimeout.current = setTimeout(() => {
              if (!containerRef.current || !containerRef.current.contains(document.activeElement)) setActive(false);
            }, 220);
          }}
        >
          <div
            ref={ref}
            className={`rich-desc ${className}`}
            contentEditable
            suppressContentEditableWarning
            data-placeholder={placeholder}
            style={defaultStyle}
            onFocus={refreshFormatState}
            onInput={() => { emitChange(); refreshFormatState(); captureSelection(); }}
            onMouseUp={() => { captureSelection(); refreshFormatState(); }}
            onKeyUp={() => { captureSelection(); refreshFormatState(); }}
            onSelect={captureSelection}
            onFocusCapture={(e) => {
              setTimeout(() => {
                try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch {}
              }, 260);
            }}
          />
          {active && (
            <DescToolbar
              onCmd={onCmd}
              onFont={onFont}
              onSize={onSize}
              onColor={onColor}
              activeFormats={activeFormats}
              onClose={closeToolbar}
            />
          )}
        </div>
      );
    }

    function CropModal({ src, onApply, onCancel }) {
      const canvasRef = useRef(null);
      const imgRef = useRef(null);
      const [sel, setSel] = useState(null);
      const dragRef = useRef(null);

      useEffect(() => {
        const img = new Image();
        img.onload = () => {
          imgRef.current = img;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const maxW = Math.min(window.innerWidth * 0.7, 600);
          const maxH = Math.min(window.innerHeight * 0.55, 450);
          let w = img.width,
            h = img.height;
          const scale = Math.min(maxW / w, maxH / h, 1);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          setSel({ x: 0, y: 0, w, h });
        };
        img.src = src;
      }, [src]);

      const drawOverlay = useCallback(() => {
        const canvas = canvasRef.current;
        const img = imgRef.current;
        if (!canvas || !img || !sel) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.clearRect(sel.x, sel.y, sel.w, sel.h);
        ctx.drawImage(img, sel.x * (img.width / canvas.width), sel.y * (img.height / canvas.height),
          sel.w * (img.width / canvas.width), sel.h * (img.height / canvas.height),
          sel.x, sel.y, sel.w, sel.h);
        ctx.strokeStyle = '#1A56C4';
        ctx.lineWidth = 2;
        ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      }, [sel]);

      useEffect(() => { drawOverlay(); }, [drawOverlay]);

      const onPointerDown = (e) => {
        e.preventDefault();
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        dragRef.current = { startX: x, startY: y, mode: 'new' };
        setSel({ x, y, w: 0, h: 0 });
        try { canvas.setPointerCapture(e.pointerId); } catch {}
      };
      const onPointerMove = (e) => {
        if (!dragRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(canvas.width, e.clientX - rect.left));
        const y = Math.max(0, Math.min(canvas.height, e.clientY - rect.top));
        const { startX, startY } = dragRef.current;
        const nx = Math.min(startX, x);
        const ny = Math.min(startY, y);
        const nw = Math.abs(x - startX);
        const nh = Math.abs(y - startY);
        setSel({ x: nx, y: ny, w: nw, h: nh });
      };
      const onPointerUp = (e) => {
        dragRef.current = null;
        try { canvasRef.current.releasePointerCapture(e.pointerId); } catch {}
      };

      const applyCrop = () => {
        const canvas = canvasRef.current;
        const img = imgRef.current;
        if (!canvas || !img || !sel || sel.w < 4 || sel.h < 4) {
          onApply(src);
          return;
        }
        const scaleX = img.width / canvas.width;
        const scaleY = img.height / canvas.height;
        const out = document.createElement('canvas');
        out.width = Math.round(sel.w * scaleX);
        out.height = Math.round(sel.h * scaleY);
        const ctx = out.getContext('2d');
        ctx.drawImage(img, sel.x * scaleX, sel.y * scaleY, sel.w * scaleX, sel.h * scaleY, 0, 0, out.width, out
          .height);
        onApply(out.toDataURL('image/png'));
      };

      return (
        <div className="crop-overlay no-print" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
          <div className="crop-panel">
            <div style={{ fontWeight: 700, color: '#0B2E6D', fontSize: 14 }}>Crop Image — drag to select area</div>
            <div className="crop-canvas-wrap">
              <canvas
              ref={canvasRef}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerLeave={onPointerUp}
              style={{ display: 'block', maxWidth: '100%', touchAction: 'none' }}
              />
            </div>
            <div className="crop-actions">
              <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
              <button type="button" className="btn-apply" onClick={applyCrop}>Apply Crop</button>
            </div>
          </div>
        </div>
      );
    }

    function PlacedImage({ data, onChange, onDelete, boxRef }) {
      const [selected, setSelected] = useState(false);
      const dragState = useRef(null);

      const clamp = (pos) => {
        const box = boxRef.current;
        if (!box) return pos;
        const bw = box.clientWidth;
        const bh = box.clientHeight;
        let { x, y, w, h } = pos;
        w = Math.max(24, Math.min(w, bw));
        h = Math.max(24, Math.min(h, bh));
        x = Math.max(0, Math.min(x, bw - w));
        y = Math.max(0, Math.min(y, bh - h));
        return { ...pos, x, y, w, h };
      };

      // touch-action:none (set via CSS on .placed-img/.resize-handle) plus
      // explicit pointer capture is what makes this reliable on touch: without
      // both, the browser can interpret a finger-drag on the image as a page
      // scroll/pan and hijack the gesture before pointermove ever fires, or
      // the pointer can "slide off" the element mid-drag and stop delivering
      // move events. Capturing on the exact element the gesture started on
      // keeps every subsequent move/up event routed there regardless of
      // where the finger travels.
      const onMoveDown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setSelected(true);
        dragState.current = { mode: 'move', startX: e.clientX, startY: e.clientY, origX: data.x, origY: data.y, zoom: getSheetZoomFactor() };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
      };
      const onMoveMove = (e) => {
        const st = dragState.current;
        if (!st || st.mode !== 'move') return;
        const dx = (e.clientX - st.startX) / st.zoom;
        const dy = (e.clientY - st.startY) / st.zoom;
        onChange(clamp({ ...data, x: st.origX + dx, y: st.origY + dy }));
      };
      const onMoveUp = (e) => {
        dragState.current = null;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
      };

      // Resize tracks the pointer's actual position relative to the box (not
      // just horizontal delta from the start point) so dragging a corner in
      // any direction — including mostly-vertical — smoothly scales the
      // image. The opposite corner stays anchored and width/height are
      // always recomputed from the same ratio, so the aspect ratio can never
      // drift out of sync regardless of drag direction.
      const onResizeDown = (e, corner) => {
        e.preventDefault();
        e.stopPropagation();
        setSelected(true);
        dragState.current = { mode: 'resize', corner, orig: { ...data }, zoom: getSheetZoomFactor() };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
      };
      const onResizeMove = (e) => {
        const st = dragState.current;
        if (!st || st.mode !== 'resize') return;
        const box = boxRef.current;
        if (!box) return;
        const rect = box.getBoundingClientRect();
        const px = (e.clientX - rect.left) / st.zoom;
        const py = (e.clientY - rect.top) / st.zoom;
        const o = st.orig;
        const ratio = o.w / o.h;
        let anchorX, anchorY;
        if (st.corner === 'br') { anchorX = o.x; anchorY = o.y; }
        else if (st.corner === 'bl') { anchorX = o.x + o.w; anchorY = o.y; }
        else if (st.corner === 'tr') { anchorX = o.x; anchorY = o.y + o.h; }
        else { anchorX = o.x + o.w; anchorY = o.y + o.h; }

        const dxAnchor = Math.abs(px - anchorX);
        const dyAnchor = Math.abs(py - anchorY);
        const nw = Math.max(24, (dxAnchor + dyAnchor * ratio) / 2);
        const nh = nw / ratio;

        let nx, ny;
        if (st.corner === 'br') { nx = o.x; ny = o.y; }
        else if (st.corner === 'bl') { nx = anchorX - nw; ny = o.y; }
        else if (st.corner === 'tr') { nx = o.x; ny = anchorY - nh; }
        else { nx = anchorX - nw; ny = anchorY - nh; }

        onChange(clamp({ ...data, x: nx, y: ny, w: nw, h: nh }));
      };
      const onResizeUp = (e) => {
        dragState.current = null;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
      };

      useEffect(() => {
        const onDocClick = (e) => {
          if (boxRef.current && !boxRef.current.contains(e.target)) setSelected(false);
        };
        document.addEventListener('click', onDocClick);
        return () => document.removeEventListener('click', onDocClick);
      }, [boxRef]);

      return (
        <div
        className={`placed-img ${selected ? 'selected' : ''}`}
        style={{ left: data.x, top: data.y, width: data.w, height: data.h }}
        onPointerDown={onMoveDown}
        onPointerMove={onMoveMove}
        onPointerUp={onMoveUp}
        onPointerCancel={onMoveUp}
        >
        <img
        src={data.src}
        alt=""
        draggable={false}
        style={{ width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none', display: 'block' }}
        />
        {selected && (
          <>
          <div className="resize-handle tl" onPointerDown={(e) => onResizeDown(e, 'tl')} onPointerMove={onResizeMove} onPointerUp={onResizeUp} onPointerCancel={onResizeUp} />
          <div className="resize-handle tr" onPointerDown={(e) => onResizeDown(e, 'tr')} onPointerMove={onResizeMove} onPointerUp={onResizeUp} onPointerCancel={onResizeUp} />
          <div className="resize-handle bl" onPointerDown={(e) => onResizeDown(e, 'bl')} onPointerMove={onResizeMove} onPointerUp={onResizeUp} onPointerCancel={onResizeUp} />
          <div className="resize-handle br" onPointerDown={(e) => onResizeDown(e, 'br')} onPointerMove={onResizeMove} onPointerUp={onResizeUp} onPointerCancel={onResizeUp} />
          </>
        )}
      </div>
    );
  }

  function ImageZone({ value, onChange, defaultW, defaultH, children, label }) {
    const boxRef = useRef(null);
    const fileRef = useRef(null);
    const imgData = value;
    const setImgData = onChange;
    const [cropSrc, setCropSrc] = useState(null);
    const [error, setError] = useState('');

    const onFile = (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) {
        setError('Please choose a valid image file.');
        setTimeout(() => setError(''), 3000);
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => {
        setError('Could not read that image. Please try another file.');
        setTimeout(() => setError(''), 3000);
      };
      reader.onload = () => setCropSrc(reader.result);
      reader.readAsDataURL(file);
    };

    const onCropApply = (dataUrl) => {
      setCropSrc(null);
      const box = boxRef.current;
      const bw = box ? box.clientWidth : defaultW;
      const bh = box ? box.clientHeight : defaultH;
      const img = new Image();
      img.onload = () => {
        const ratio = img.width / img.height;
        let w = Math.min(bw * 0.85, img.width);
        let h = w / ratio;
        if (h > bh * 0.85) {
          h = bh * 0.85;
          w = h * ratio;
        }
        setImgData({
          src: dataUrl,
          x: (bw - w) / 2,
          y: (bh - h) / 2,
          w,
          h
        });
      };
      img.src = dataUrl;
    };

    return (
      <div>
        <div
        ref={boxRef}
        className="img-box"
        style={{ width: '100%', height: defaultH, position: 'relative' }}
        >
        {!imgData && children}
        {imgData && (
          <PlacedImage
          data={imgData}
          onChange={setImgData}
          boxRef={boxRef}
          />
        )}
      </div>
      <div className="img-controls no-print">
        <button type="button" className="upload-btn" onClick={() => fileRef.current && fileRef.current.click()}>
          {imgData ? `Replace ${label}` : `Upload ${label}`}
        </button>
        {imgData && (
          <button type="button" className="upload-btn" onClick={() => setImgData(null)}>
            Delete {label}
          </button>
        )}
        {error && <span style={{ fontSize: 10, color: '#D32F2F', fontFamily: 'Montserrat, sans-serif' }}>{error}</span>}
      </div>
      <input
      ref={fileRef}
      type="file"
      accept="image/png,image/jpeg,image/webp,image/*"
      style={{ display: 'none' }}
      onChange={onFile}
      />
      {cropSrc && (
        <CropModal
        src={cropSrc}
        onApply={onCropApply}
        onCancel={() => setCropSrc(null)}
        />
      )}
    </div>
  );
}

const DEFAULT_TABLE_SETTINGS = {
  showSerial: true,
  showDescription: true,
  showUnit: true,
  showQty: true,
  showRate: true,
  showAmount: true,
  showRowDelete: true,
  showBorders: true,
  compactRows: false,
  richTextEnabled: true
};

function getColumnWidths(ts) {
  const weights = {
    serial: ts.showSerial ? 8 : 0,
    description: ts.showDescription ? 40 : 0,
    unit: ts.showUnit ? 10 : 0,
    qty: ts.showQty ? 12 : 0,
    rate: ts.showRate ? 14 : 0,
    amount: ts.showAmount ? 14 : 0
  };
  const total = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  const pct = {};
  Object.keys(weights).forEach((k) => { pct[k] = weights[k] ? (weights[k] / total * 100) : 0; });
  return pct;
}

function stripHtmlToText(html) {
  if (!html) return '';
  if (!/[<&]/.test(html)) return html;
  const div = document.createElement('div');
  div.innerHTML = html;
  return div.textContent || '';
}

function rowHasContent(item) {
  const plainDesc = (item.description || '').replace(/<[^>]*>/g, '').trim();
  return !!(plainDesc || (item.unit || '').trim() || (item.qty || '').toString().trim() ||
    (item.rate || '').toString().trim() || (item.amount || '').toString().trim());
}

function AlignableCell({ value, align, onChange, onAlignChange, className = '', textStyle, onTextStyleChange, onResetTextStyle }) {
  const resolvedAlign = align || 'bottom';
  const css = textStyleToCss(textStyle, 12.5);
  return (
    <div className={`cell-align-wrap cell-align-${resolvedAlign}`}>
      <EditLine multiline value={value} onChange={onChange} className={className} style={css} />
      <div className="cell-align-toolbar no-print">
        <button type="button" className={resolvedAlign === 'top' ? 'active' : ''} title="Align top" onClick={() => onAlignChange('top')}>T</button>
        <button type="button" className={resolvedAlign === 'center' ? 'active' : ''} title="Align center" onClick={() => onAlignChange('center')}>C</button>
        <button type="button" className={resolvedAlign === 'bottom' ? 'active' : ''} title="Align bottom" onClick={() => onAlignChange('bottom')}>B</button>
      </div>
      {onTextStyleChange && (
        <FormatPopover style={textStyle} onChange={onTextStyleChange} onReset={onResetTextStyle} />
      )}
    </div>
  );
}

const ItemRow = React.memo(function ItemRow({ item, index, isFirst, isLast, canDelete, ts, borderCls, cellPad, defaults, onUpdateItem, onUpdateItemStyle, onDuplicateRow, onMoveRow, onRemoveRow }) {
  const handleDeleteClick = () => {
    if (rowHasContent(item)) {
      if (!window.confirm('This row has content. Delete it anyway?')) return;
    }
    onRemoveRow(item.id);
  };
  return (
    <tr className={`align-top ${item._justAdded ? 'row-adding' : ''}`}>
      <td className="no-print" style={{ width: 30, verticalAlign: 'top' }}>
        <div className="row-actions">
          <button type="button" className="row-act-btn" title="Duplicate row" onClick={() => onDuplicateRow(item.id)}><IconDuplicate className="h-[11px] w-[11px]" /></button>
          <button type="button" className="row-act-btn" title="Move up" disabled={isFirst} onClick={() => onMoveRow(item.id, -1)}><IconUp className="h-[11px] w-[11px]" /></button>
          <button type="button" className="row-act-btn" title="Move down" disabled={isLast} onClick={() => onMoveRow(item.id, 1)}><IconDown className="h-[11px] w-[11px]" /></button>
          {ts.showRowDelete && (
            <button type="button" className="row-act-btn" title="Delete row" disabled={!canDelete} onClick={handleDeleteClick}><IconClose className="h-[12px] w-[12px]" /></button>
          )}
        </div>
      </td>
      {ts.showSerial && (
        <td className={`${borderCls} px-[5px] ${cellPad} text-center text-[12.5px]`}>{index + 1}</td>
      )}
      {ts.showDescription && (
        <td className={`${borderCls} px-[8px] ${cellPad} text-[12.5px] leading-[18px]`}>
          <div className="desc-cell-align">
            {ts.richTextEnabled !== false ? (
              <RichDescriptionEditor
                value={item.description}
                onChange={(v) => onUpdateItem(item.id, 'description', v)}
                placeholder="Enter description…"
                className="pdf-no-underline"
                defaultStyle={{
                  fontFamily: defaults.font,
                  fontSize: (defaults.size || 12.5) + 'px',
                  color: defaults.color,
                  textAlign: defaults.align
                }}
              />
            ) : (
              <EditLine
                multiline
                value={stripHtmlToText(item.description)}
                onChange={(v) => onUpdateItem(item.id, 'description', v)}
                placeholder="Enter description…"
                className="pdf-no-underline"
              />
            )}
          </div>
        </td>
      )}
      {ts.showUnit && (
        <td className={`${borderCls} px-[5px] ${cellPad} text-center text-[12.5px] leading-[16px]`}>
          <AlignableCell
            value={item.unit}
            align={item.unitAlign}
            onChange={(v) => onUpdateItem(item.id, 'unit', v)}
            onAlignChange={(a) => onUpdateItem(item.id, 'unitAlign', a)}
            className="pdf-no-underline"
            textStyle={item.unitStyle}
            onTextStyleChange={(patch) => onUpdateItemStyle(item.id, 'unitStyle', patch)}
            onResetTextStyle={() => onUpdateItemStyle(item.id, 'unitStyle', null)}
          />
        </td>
      )}
      {ts.showQty && (
        <td className={`${borderCls} px-[8px] ${cellPad}`}>
          <AlignableCell
            value={item.qty}
            align={item.qtyAlign}
            onChange={(v) => onUpdateItem(item.id, 'qty', v)}
            onAlignChange={(a) => onUpdateItem(item.id, 'qtyAlign', a)}
            className="pdf-no-underline"
            textStyle={item.qtyStyle}
            onTextStyleChange={(patch) => onUpdateItemStyle(item.id, 'qtyStyle', patch)}
            onResetTextStyle={() => onUpdateItemStyle(item.id, 'qtyStyle', null)}
          />
        </td>
      )}
      {ts.showRate && (
        <td className={`${borderCls} px-[8px] ${cellPad}`}>
          <AlignableCell
            value={item.rate}
            align={item.rateAlign}
            onChange={(v) => onUpdateItem(item.id, 'rate', v)}
            onAlignChange={(a) => onUpdateItem(item.id, 'rateAlign', a)}
            className="pdf-no-underline"
            textStyle={item.rateStyle}
            onTextStyleChange={(patch) => onUpdateItemStyle(item.id, 'rateStyle', patch)}
            onResetTextStyle={() => onUpdateItemStyle(item.id, 'rateStyle', null)}
          />
        </td>
      )}
      {ts.showAmount && (
        <td className={`${borderCls} px-[8px] ${cellPad}`}>
          <AlignableCell
            value={item.amount}
            align={item.amountAlign}
            onChange={(v) => onUpdateItem(item.id, 'amount', v)}
            onAlignChange={(a) => onUpdateItem(item.id, 'amountAlign', a)}
            className="pdf-no-underline"
            textStyle={item.amountStyle}
            onTextStyleChange={(patch) => onUpdateItemStyle(item.id, 'amountStyle', patch)}
            onResetTextStyle={() => onUpdateItemStyle(item.id, 'amountStyle', null)}
          />
        </td>
      )}
    </tr>
  );
});

function ItemsTable({ items, tableSettings, defaults, onUpdateItem, onUpdateItemStyle, onAddRow, onRemoveRow, onDuplicateRow, onMoveRow, total, receivedAmount, onReceivedChange, totalStyle, onTotalStyleChange, onResetTotalStyle, balanceStyle, onBalanceStyleChange, onResetBalanceStyle }) {
  const ts = tableSettings || DEFAULT_TABLE_SETTINGS;
  const w = getColumnWidths(ts);
  const cellPad = ts.compactRows ? 'py-[4px]' : 'py-[8px]';
  const borderCls = ts.showBorders ? 'border border-navy' : 'border-0 border-b border-navy/15';

  return (
    <section className="mt-[12px] px-[20px]">
      <div style={{ overflowX: 'auto', maxWidth: '100%' }}>
      <table className={`w-full table-fixed border-collapse text-navy ${ts.showBorders ? 'border-[2px] border-navy' : ''}`} style={{ minWidth: '100%' }}>
        <colgroup>
          <col className="no-print" style={{ width: 30 }} />
          {ts.showSerial && <col style={{ width: w.serial + '%' }} />}
          {ts.showDescription && <col style={{ width: w.description + '%' }} />}
          {ts.showUnit && <col style={{ width: w.unit + '%' }} />}
          {ts.showQty && <col style={{ width: w.qty + '%' }} />}
          {ts.showRate && <col style={{ width: w.rate + '%' }} />}
          {ts.showAmount && <col style={{ width: w.amount + '%' }} />}
        </colgroup>
        <thead>
          <tr className="bg-navy text-white">
            <th className="no-print" style={{ width: 30 }} />
            {ts.showSerial && <th scope="col" style={{ width: w.serial + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>SR. NO.</th>}
            {ts.showDescription && <th scope="col" style={{ width: w.description + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>DESCRIPTION</th>}
            {ts.showUnit && <th scope="col" style={{ width: w.unit + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>UNIT</th>}
            {ts.showQty && <th scope="col" style={{ width: w.qty + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>QTY</th>}
            {ts.showRate && <th scope="col" style={{ width: w.rate + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>RATE (₹)</th>}
            {ts.showAmount && <th scope="col" style={{ width: w.amount + '%' }} className={`${borderCls} px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>AMOUNT (₹)</th>}
          </tr>
        </thead>
        <tbody>
          {items.map((item, index) => (
            <ItemRow
              key={item.id}
              item={item}
              index={index}
              isFirst={index === 0}
              isLast={index === items.length - 1}
              canDelete={items.length > 1}
              ts={ts}
              borderCls={borderCls}
              cellPad={cellPad}
              defaults={defaults}
              onUpdateItem={onUpdateItem}
              onUpdateItemStyle={onUpdateItemStyle}
              onDuplicateRow={onDuplicateRow}
              onMoveRow={onMoveRow}
              onRemoveRow={onRemoveRow}
            />
          ))}
          <tr className="no-print">
            <td colSpan={1 + [ts.showSerial, ts.showDescription, ts.showUnit, ts.showQty, ts.showRate, ts.showAmount].filter(Boolean).length} className={`${borderCls} px-[8px] py-[6px]`}>
              <button type="button" className="upload-btn" onClick={onAddRow} style={{ fontWeight: 600 }}>+ Add Row</button>
            </td>
          </tr>
          {ts.showAmount && (() => {
            const visibleCount = [ts.showSerial, ts.showDescription, ts.showUnit, ts.showQty, ts.showRate, ts.showAmount].filter(Boolean).length;
            const totalNum = parseFloat(String(total || '0').replace(/,/g, '')) || 0;
            const receivedNum = parseFloat(String(receivedAmount || '0').replace(/,/g, '')) || 0;
            const finalNum = totalNum - receivedNum;
            // Total/Received/Balance render as one merged box (rather than
            // three separate floating chips) — each line is a row inside it,
            // divided by a thin hairline, with Balance picked out via a
            // brandblue fill on the box's own last row.
            const summaryLine = (label, valueNode, extraCls = '') => (
              <div className={`flex items-center justify-between gap-[6px] px-[10px] py-[5px] ${extraCls}`}>
                <span className="text-[9px] font-semibold tracking-[0.02em] text-white shrink-0 amt-nowrap">{label}</span>
                {valueNode}
              </div>
            );
            return (
              <tr>
                <td className="no-print border-0" />
                <td colSpan={visibleCount} className={`${borderCls} border-t-0 py-[4px]`}>
                  <div className="flex justify-end">
                    <div className="bg-navy rounded-[4px] overflow-hidden" style={{ minWidth: 168 }}>
                      {summaryLine('TOTAL AMOUNT', (
                        <FormattableValue
                          text={`₹${formatINR(totalNum)}`}
                          style={totalStyle}
                          onStyleChange={onTotalStyleChange}
                          onResetStyle={onResetTotalStyle}
                          className="text-[10px] font-bold text-white shrink-0 amt-nowrap"
                        />
                      ))}
                      {summaryLine('RECEIVED', (
                        <div className="flex items-center gap-[2px] shrink-0">
                          <span className="text-[9.5px] text-white shrink-0 amt-nowrap">₹</span>
                          <EditLine value={receivedAmount} onChange={onReceivedChange} white className="text-right text-[10px] amt-nowrap" style={{ width: '17ch' }} />
                        </div>
                      ), 'border-t border-white/25')}
                      {summaryLine('BALANCE', (
                        <FormattableValue
                          text={`₹${formatINR(finalNum)}`}
                          style={balanceStyle}
                          onStyleChange={onBalanceStyleChange}
                          onResetStyle={onResetBalanceStyle}
                          className="text-[10px] font-bold text-white shrink-0 amt-nowrap"
                        />
                      ), 'border-t border-white/25 bg-brandblue')}
                    </div>
                  </div>
                </td>
              </tr>
            );
          })()}
        </tbody>
      </table>
      </div>
    </section>
  );
}

function TermsAndSignature({ fields, setField, signature, setSignature, stamp, setStamp, category = 'waterproofing' }) {
  return (
    <section className="mt-[16px] flex flex-1 items-start gap-[14px] px-[20px] pb-[12px]">
      <div className="w-[52%] self-stretch border-r border-navy/50 pr-[14px]">
        <div className="flex items-center gap-[7px]">
          <ClipboardListSvg className="h-[20px] w-[20px] text-navy shrink-0" />
          <h2 className="text-[12.5px] font-bold tracking-[0.04em] text-navy">TERMS &amp; CONDITIONS</h2>
        </div>
        <ol className="mt-[8px] list-decimal space-y-[4px] pl-[18px] text-[10px] leading-[14px] text-navy marker:text-navy">
          {terms.map((term) => <li key={term}>{term}</li>)}
        </ol>
      </div>
      <div className="flex flex-1 items-start justify-between gap-[10px] pt-[8px]">
        <div className="w-[180px]">
          <ImageZone value={signature} onChange={setSignature} defaultH={52} defaultW={180} label="Signature">
            <div style={{ height: 52 }} aria-hidden="true" />
          </ImageZone>
          <div style={{ borderBottom: '1.5px solid #0B2E6D', marginTop: 0 }} />
          <p className="mt-[6px] text-[11.5px] font-bold tracking-[0.04em] text-brandblue">CONTRACTOR SIGNATURE</p>
          <dl className="mt-[10px] space-y-[10px]">
            <div className="flex items-end gap-[6px]">
              <dt className="w-[44px] shrink-0 text-[11.5px] leading-[13px] text-navy">Name</dt>
              <span className="text-[11.5px] leading-[13px] text-navy">:</span>
              <dd className="flex-1">
                <EditLine value={fields.sigName} onChange={(v) => setField('sigName', v)} />
              </dd>
            </div>
            <div className="flex items-end gap-[6px]">
              <dt className="w-[44px] shrink-0 text-[11.5px] leading-[13px] text-navy">Mobile</dt>
              <span className="text-[11.5px] leading-[13px] text-navy">:</span>
              <dd className="flex-1">
                <EditLine value={fields.sigMobile} onChange={(v) => setField('sigMobile', v)} />
              </dd>
            </div>
          </dl>
        </div>
        <div style={{ width: 110 }}>
          <ImageZone value={stamp} onChange={setStamp} defaultH={110} defaultW={110} label="Stamp">
            <StampSvg className="h-[110px] w-[110px]" variant={category} />
          </ImageZone>
        </div>
      </div>
    </section>
  );
}

function FooterBar({ category = 'waterproofing' }) {
  const isPlumbing = category === 'plumbing';
  return (
    <footer className="relative block w-full overflow-hidden leading-none">
      <img
        src={isPlumbing ? FOOTER_BANNER_IMG_PLUMBING : FOOTER_BANNER_IMG}
        alt={isPlumbing
          ? "Sadiq Plumbing Solution — Plumbing Solutions, Pipe & Fixture Repair, Expert Service & Support. Thank you, we look forward to working with you."
          : "Sadiq Waterproofing Solution — Waterproofing Solutions, Roof & Terrace Protection, Expert Service & Support. Thank you, we look forward to working with you."}
        className="block h-auto w-full select-none"
        draggable="false"
      />
    </footer>
  );
}

function relativeSavedText(ts) {
  if (!ts) return 'Saved';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 5) return 'Saved just now';
  if (sec < 60) return `Saved ${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `Saved ${min}m ago`;
  return 'Saved';
}

function TopAppBar({ title, onBack, onSave, saveStatus, lastSavedAt }) {
  // A tiny, transient status line under the title instead of a card that
  // floats over the document — visible while actively saving, then fades
  // out a couple of seconds after a save completes so it never lingers.
  const [showSaved, setShowSaved] = useState(false);
  useEffect(() => {
    if (saveStatus === 'saved') {
      setShowSaved(true);
      const t = setTimeout(() => setShowSaved(false), 2500);
      return () => clearTimeout(t);
    }
    setShowSaved(false);
  }, [saveStatus, lastSavedAt]);

  const [, forceTick] = useState(0);
  useEffect(() => {
    if (saveStatus !== 'saved' || !showSaved) return;
    const id = setInterval(() => forceTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [saveStatus, showSaved]);

  return (
    <div className="app-bar no-print">
      <div className="app-bar-left">
        <button type="button" className="icon-btn ripple-surface" onClick={onBack} title="Back">
          <IconBack className="h-[20px] w-[20px]" />
        </button>
        <div>
          <div className="app-bar-title">{title}</div>
          {(saveStatus === 'saving' || showSaved) && (
            <div className="app-bar-sub">{saveStatus === 'saving' ? 'Saving…' : relativeSavedText(lastSavedAt)}</div>
          )}
        </div>
      </div>
      <button type="button" className="app-bar-save ripple-surface" onClick={onSave} title="Save">
        <IconSave className="h-[16px] w-[16px]" />
        Save
      </button>
    </div>
  );
}

function EditorToolbar({ onUndo, onRedo, canUndo, canRedo, onAddRow, onSave, onPdf, onShare, onSettings, pdfBusy }) {
  return (
    <div className="editor-toolbar no-print">
      <ToolbarButton icon={IconUndo} label="Undo" onClick={onUndo} disabled={!canUndo} />
      <ToolbarButton icon={IconRedo} label="Redo" onClick={onRedo} disabled={!canRedo} />
      <div className="tb-sep" />
      <ToolbarButton icon={IconAddRow} label="Add Row" onClick={onAddRow} />
      <ToolbarButton icon={IconSave} label="Save" onClick={onSave} />
      <ToolbarButton icon={IconPdfBox} label={pdfBusy ? 'Working…' : 'PDF'} onClick={onPdf} disabled={pdfBusy} extraClass="tb-pdf" />
      <ToolbarButton icon={IconShare} label="Share" onClick={onShare} extraClass="tb-share" />
      <div className="tb-sep" />
      <ToolbarButton icon={IconSettingsGear} label="Settings" onClick={onSettings} />
    </div>
  );
}

function LayoutSection({ id, editEnabled, layout, onMove, onMoveEnd, label, children }) {
  const pos = layout[id] || { x: 0, y: 0 };
  const dragRef = useRef(null);
  const elRef = useRef(null);

  const onPointerDown = (e) => {
    if (!editEnabled) return;
    e.preventDefault();
    e.stopPropagation();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: pos.x || 0, origY: pos.y || 0, zoom: getSheetZoomFactor() };
    try { elRef.current.setPointerCapture(e.pointerId); } catch {}
  };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const dx = (e.clientX - dragRef.current.startX) / dragRef.current.zoom;
    const dy = (e.clientY - dragRef.current.startY) / dragRef.current.zoom;
    onMove(id, { x: dragRef.current.origX + dx, y: dragRef.current.origY + dy });
  };
  const onPointerUp = () => {
    if (!dragRef.current) return;
    dragRef.current = null;
    onMoveEnd();
  };

  const hasOffset = !!(pos.x || pos.y);

  return (
    <div
      ref={elRef}
      className={editEnabled ? 'layout-editing' : ''}
      style={{
        position: 'relative',
        transform: hasOffset ? `translate(${pos.x || 0}px, ${pos.y || 0}px)` : undefined,
        zIndex: editEnabled ? 5 : undefined,
        touchAction: editEnabled ? 'none' : undefined
      }}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
    >
      {editEnabled && <div className="layout-drag-label no-print">{label} — drag to move</div>}
      {children}
    </div>
  );
}
