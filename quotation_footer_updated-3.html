  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // Full company name
    const company = {

    // Removed the 4th term (Quotation Validity)
    const terms = [

    ];

    const footerBadges = [

      { icon: 'shield-check', label: 'LONG LASTING PROTECTION' }
    ];

    const STORAGE_FIELDS = 'quotation_fields_v1';
    const STORAGE_ITEMS = 'quotation_items_v1';
    const STORAGE_DOCTYPE = 'quotation_doctype_v1';
    const STORAGE_SIG = 'quotation_sig_v1';

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch { return fallback; }
    }

    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function EditLine({ value, onChange, className = '', placeholder = '', multiline = false, white = false }) {
      const cls = `edit-line ${white ? 'white-line' : ''} ${className}`;
      const taRef = useRef(null);

      useEffect(() => {
        if (multiline && taRef.current) {
          const el = taRef.current;
          el.style.height = 'auto';
          el.style.height = Math.max(20, el.scrollHeight) + 'px';
        }
      }, [value, multiline]);

      if (multiline) {
        return (
          <textarea
          ref={taRef}
          className={cls}
          value={value || ''}
          onChange={(e) => {
            onChange(e.target.value);
            const el = e.target;
            el.style.height = 'auto';
            el.style.height = Math.max(20, el.scrollHeight) + 'px';
          }}
          rows={1}
          placeholder={placeholder}
          style={{ width: '100%' }}
          />
        );
      }
      return (
        <input
        type="text"
        className={cls}
        value={value || ''}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        />
      );
    }

    function CropModal({ src, onApply, onCancel }) {
      const canvasRef = useRef(null);
      const imgRef = useRef(null);
      const [sel, setSel] = useState(null);
      const dragRef = useRef(null);

      useEffect(() => {
        const img = new Image();
        img.onload = () => {
          imgRef.current = img;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const maxW = Math.min(window.innerWidth * 0.7, 600);
          const maxH = Math.min(window.innerHeight * 0.55, 450);
          let w = img.width,
            h = img.height;
          const scale = Math.min(maxW / w, maxH / h, 1);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          setSel({ x: 0, y: 0, w, h });
        };
        img.src = src;
      }, [src]);

      const drawOverlay = useCallback(() => {
        const canvas = canvasRef.current;
        const img = imgRef.current;
        if (!canvas || !img || !sel) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.clearRect(sel.x, sel.y, sel.w, sel.h);
        ctx.drawImage(img, sel.x * (img.width / canvas.width), sel.y * (img.height / canvas.height),
          sel.w * (img.width / canvas.width), sel.h * (img.height / canvas.height),
          sel.x, sel.y, sel.w, sel.h);
        ctx.strokeStyle = '#1A56C4';
        ctx.lineWidth = 2;
        ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      }, [sel]);

      useEffect(() => { drawOverlay(); }, [drawOverlay]);

      const onPointerDown = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        dragRef.current = { startX: x, startY: y, mode: 'new' };
        setSel({ x, y, w: 0, h: 0 });
      };
      const onPointerMove = (e) => {
        if (!dragRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(canvas.width, e.clientX - rect.left));
        const y = Math.max(0, Math.min(canvas.height, e.clientY - rect.top));
        const { startX, startY } = dragRef.current;
        const nx = Math.min(startX, x);
        const ny = Math.min(startY, y);
        const nw = Math.abs(x - startX);
        const nh = Math.abs(y - startY);
        setSel({ x: nx, y: ny, w: nw, h: nh });
      };
      const onPointerUp = () => { dragRef.current = null; };

      const applyCrop = () => {
        const canvas = canvasRef.current;
        const img = imgRef.current;
        if (!canvas || !img || !sel || sel.w < 4 || sel.h < 4) {
          onApply(src);
          return;
        }
        const scaleX = img.width / canvas.width;
        const scaleY = img.height / canvas.height;
        const out = document.createElement('canvas');
        out.width = Math.round(sel.w * scaleX);
        out.height = Math.round(sel.h * scaleY);
        const ctx = out.getContext('2d');
        ctx.drawImage(img, sel.x * scaleX, sel.y * scaleY, sel.w * scaleX, sel.h * scaleY, 0, 0, out.width, out
          .height);
        onApply(out.toDataURL('image/png'));
      };

      return (
        <div className="crop-overlay" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
          <div className="crop-panel">
            <div style={{ fontWeight: 700, color: '#0B2E6D', fontSize: 14 }}>Crop Image — drag to select area</div>
            <div className="crop-canvas-wrap">
              <canvas
              ref={canvasRef}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerLeave={onPointerUp}
              style={{ display: 'block', maxWidth: '100%' }}
              />
            </div>
            <div className="crop-actions">
              <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
              <button type="button" className="btn-apply" onClick={applyCrop}>Apply Crop</button>
            </div>
          </div>
        </div>
      );
    }

    function PlacedImage({ data, onChange, onDelete, boxRef }) {
      const [selected, setSelected] = useState(false);
      const dragState = useRef(null);

      const clamp = (pos) => {
        const box = boxRef.current;
        if (!box) return pos;
        const bw = box.clientWidth;
        const bh = box.clientHeight;
        let { x, y, w, h } = pos;
        w = Math.max(24, Math.min(w, bw));
        h = Math.max(24, Math.min(h, bh));
        x = Math.max(0, Math.min(x, bw - w));
        y = Math.max(0, Math.min(y, bh - h));
        return { ...pos, x, y, w, h };
      };

      const onMoveStart = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setSelected(true);
        dragState.current = {
          mode: 'move',
          startX: e.clientX,
          startY: e.clientY,
          origX: data.x,
          origY: data.y
        };
      };

      const onResizeStart = (e, corner) => {
        e.preventDefault();
        e.stopPropagation();
        setSelected(true);
        dragState.current = {
          mode: 'resize',
          corner,
          startX: e.clientX,
          startY: e.clientY,
          orig: { ...data }
        };
      };

      useEffect(() => {
        const onMove = (e) => {
          if (!dragState.current) return;
          const st = dragState.current;
          if (st.mode === 'move') {
            const dx = e.clientX - st.startX;
            const dy = e.clientY - st.startY;
            onChange(clamp({ ...data, x: st.origX + dx, y: st.origY + dy }));
          } else if (st.mode === 'resize') {
            const dx = e.clientX - st.startX;
            const dy = e.clientY - st.startY;
            const o = st.orig;
            const ratio = o.w / o.h;
            let nw = o.w,
              nh = o.h,
              nx = o.x,
              ny = o.y;
            if (st.corner === 'br') {
              nw = o.w + dx;
              nh = nw / ratio;
            } else if (st.corner === 'bl') {
              nw = o.w - dx;
              nh = nw / ratio;
              nx = o.x + (o.w - nw);
            } else if (st.corner === 'tr') {
              nw = o.w + dx;
              nh = nw / ratio;
              ny = o.y + (o.h - nh);
            } else if (st.corner === 'tl') {
              nw = o.w - dx;
              nh = nw / ratio;
              nx = o.x + (o.w - nw);
              ny = o.y + (o.h - nh);
            }
            onChange(clamp({ ...data, x: nx, y: ny, w: nw, h: nh }));
          }
        };
        const onUp = () => { dragState.current = null; };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
      });

      useEffect(() => {
        const onDocClick = (e) => {
          if (boxRef.current && !boxRef.current.contains(e.target)) setSelected(false);
        };
        document.addEventListener('click', onDocClick);
        return () => document.removeEventListener('click', onDocClick);
      }, [boxRef]);

      return (
        <div
        className={`placed-img ${selected ? 'selected' : ''}`}
        style={{ left: data.x, top: data.y, width: data.w, height: data.h }}
        onPointerDown={onMoveStart}
        >
        <img
        src={data.src}
        alt=""
        draggable={false}
        style={{ width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none', display: 'block' }}
        />
        {selected && (
          <>
          <div className="resize-handle tl" onPointerDown={(e) => onResizeStart(e, 'tl')} />
          <div className="resize-handle tr" onPointerDown={(e) => onResizeStart(e, 'tr')} />
          <div className="resize-handle bl" onPointerDown={(e) => onResizeStart(e, 'bl')} />
          <div className="resize-handle br" onPointerDown={(e) => onResizeStart(e, 'br')} />
          </>
        )}
      </div>
    );
  }

  function ImageZone({ storageKey, defaultW, defaultH, children, label }) {
    const boxRef = useRef(null);
    const fileRef = useRef(null);
    const [imgData, setImgData] = useState(() => loadJSON(storageKey, null));
    const [cropSrc, setCropSrc] = useState(null);

    useEffect(() => {
      if (imgData) saveJSON(storageKey, imgData);
      else localStorage.removeItem(storageKey);
    }, [imgData, storageKey]);

    const onFile = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => setCropSrc(reader.result);
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    const onCropApply = (dataUrl) => {
      setCropSrc(null);
      const box = boxRef.current;
      const bw = box ? box.clientWidth : defaultW;
      const bh = box ? box.clientHeight : defaultH;
      const img = new Image();
      img.onload = () => {
        const ratio = img.width / img.height;
        let w = Math.min(bw * 0.85, img.width);
        let h = w / ratio;
        if (h > bh * 0.85) {
          h = bh * 0.85;
          w = h * ratio;
        }
        setImgData({
          src: dataUrl,
          x: (bw - w) / 2,
          y: (bh - h) / 2,
          w,
          h
        });
      };

  const headers = [

  ];

  const updateItem = (id, key, val) => {
    setItems((prev) => {
      const next = prev.map((it) => it.id === id ? { ...it, [key]: val } : it);
      saveJSON(STORAGE_ITEMS, next);

  };

  const addRow = () => {
    setItems((prev) => {
      const nextId = prev.length ? Math.max(...prev.map((p) => p.id)) + 1 : 1;
      const next = [...prev, { id: nextId, description: '', unit: '', qty: '', rate: '', amount: '' }];
      saveJSON(STORAGE_ITEMS, next);
      return next;
    });
  };

  const removeRow = (id) => {
    setItems((prev) => {
      if (prev.length <= 1) return prev;
      const next = prev.filter((it) => it.id !== id);
      saveJSON(STORAGE_ITEMS, next);
      return next;
    });
  };

  return (
    <section className="mt-[12px] px-[20px]">
      <table className="w-full table-fixed border-collapse border-[2px] border-navy text-navy">
        <thead>
          <tr className="bg-navy text-white">
            {headers.map((header) => (
              <th key={header.label} scope="col" className={`${header.width} border border-navy px-[5px] py-[6px] text-[11px] font-semibold tracking-[0.03em]`}>{header.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {items.map((item, index) => (
            <tr key={item.id} className="align-top">
              <td className="border border-navy px-[5px] py-[8px] text-center text-[12.5px] relative">
                {index + 1}
                {items.length > 1 && (
                  <button type="button" className="no-print upload-btn" onClick={() => removeRow(item.id)} style={{ display: 'block', margin: '4px auto 0', fontSize: '9px' }} title="Remove row">✕</button>
                )}
              </td>
              <td className="border border-navy px-[8px] py-[8px] text-[12.5px] leading-[18px]">
                <EditLine multiline value={item.description} onChange={(v) => updateItem(item.id, 'description', v)} />
              </td>
              <td className="border border-navy px-[5px] py-[8px] text-center text-[12.5px] leading-[16px]">
                <EditLine value={item.unit} onChange={(v) => updateItem(item.id, 'unit', v)} />
              </td>
              <td className="border border-navy px-[8px] py-[8px] align-bottom">
                <div style={{ minHeight: '36px', display: 'flex', alignItems: 'flex-end' }}>
                  <EditLine value={item.qty} onChange={(v) => updateItem(item.id, 'qty', v)} />
                </div>
              </td>
              <td className="border border-navy px-[8px] py-[8px] align-bottom">
                <div style={{ minHeight: '36px', display: 'flex', alignItems: 'flex-end' }}>
                  <EditLine value={item.rate} onChange={(v) => updateItem(item.id, 'rate', v)} />
                </div>
              </td>
              <td className="border border-navy px-[8px] py-[8px] align-bottom">
                <div style={{ minHeight: '36px', display: 'flex', alignItems: 'flex-end' }}>
                  <EditLine value={item.amount} onChange={(v) => updateItem(item.id, 'amount', v)} />
                </div>
              </td>
            </tr>
          ))}
          <tr className="no-print">
            <td colSpan={6} className="border border-navy px-[8px] py-[6px]">
              <button type="button" className="upload-btn" onClick={addRow} style={{ fontWeight: 600 }}>+ Add Row</button>
            </td>
          </tr>
          <tr>
            <td className="border-0" colSpan={3} />
            <th scope="row" colSpan={2} className="border border-navy bg-navy px-[8px] py-[6px] text-left text-[12px] font-semibold text-white">TOTAL AMOUNT</th>
            <td className="border border-navy px-[8px] py-[6px]">
              <div className="flex items-end gap-[4px]" style={{ minHeight: '22px' }}>
                <span className="text-[12px] leading-[14px] shrink-0">₹</span>
                <div className="flex-1 min-w-0">
                  <EditLine value={fields.total} onChange={(v) => setField('total', v)} />
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  );
}

function App() {
  // All default fields are empty strings – no pre-filled data
  const defaultFields = {
    quotationNo: '',
    date: '',
    clientName: '',
    siteAddress: '',
    contactNo: '',
    emailId: '',
    workDescription: '',
    total: '',
    sigName: '',
    sigMobile: ''
  };

  // Always start with defaults – do NOT load from localStorage for fields/items
  const [fields, setFields] = useState({ ...defaultFields });
  const [items, setItems] = useState(defaultLineItems);
  const [docType, setDocTypeState] = useState(() => loadJSON(STORAGE_DOCTYPE, 'quotation'));

  const setField = (key, val) => {
    setFields((prev) => {
      const next = { ...prev, [key]: val };
      saveJSON(STORAGE_FIELDS, next);
      return next;
    });
  };

  const setDocType = (t) => {
    setDocTypeState(t);
    saveJSON(STORAGE_DOCTYPE, t);
  };

  // Save items to localStorage on change
  useEffect(() => {
    saveJSON(STORAGE_ITEMS, items);
  }, [items]);

  useEffect(() => {
    document.getElementById('btn-pdf').onclick = async () => {
      const btn = document.getElementById('btn-pdf');
      const sheet = document.querySelector('.sheet');
      if (!sheet || !window.html2canvas || !window.jspdf) return;
      btn.disabled = true;
      btn.textContent = 'Generating PDF...';
      document.body.classList.add('pdf-exporting');

      const scaleEl = document.querySelector('.sheet-scale');
      const prevTransform = scaleEl ? scaleEl.style.transform : '';
      if (scaleEl) scaleEl.style.transform = 'none';

      const touched = [];
      const clearClip = (el) => {
        if (!el) return;
        touched.push({
          el,
          overflow: el.style.overflow,
          overflowX: el.style.overflowX,
          overflowY: el.style.overflowY
        });
        el.style.overflow = 'visible';
        el.style.overflowX = 'visible';
        el.style.overflowY = 'visible';
      };
      clearClip(sheet);
      sheet.querySelectorAll('*').forEach((el) => {
        const cs = window.getComputedStyle(el);
        if (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.overflowY === 'hidden') {
          clearClip(el);
        }
      });

      try {
        sheet.querySelectorAll('textarea.edit-line').forEach((el) => {
          el.style.height = 'auto';
          el.style.height = Math.max(22, el.scrollHeight) + 'px';
          el.style.overflow = 'visible';
        });
        await new Promise((r) => setTimeout(r, 100));

        const canvas = await html2canvas(sheet, {
          scale: 2.5,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          logging: false,
          scrollX: 0,
          scrollY: -window.scrollY,
          x: 0,
          y: 0,
          width: Math.ceil(sheet.getBoundingClientRect().width),
          height: Math.ceil(sheet.scrollHeight),
          onclone: (doc) => {
            const clonedSheet = doc.querySelector('.sheet');
            if (clonedSheet) {
              clonedSheet.style.overflow = 'visible';
              clonedSheet.style.boxShadow = 'none';
              clonedSheet.style.border = 'none';
              clonedSheet.style.transform = 'none';
            }
            const scaleClone = doc.querySelector('.sheet-scale');
            if (scaleClone) scaleClone.style.transform = 'none';

            doc.querySelectorAll('textarea.edit-line, input.edit-line').forEach((el) => {
              const div = doc.createElement('div');
              const isWhite = el.classList.contains('white-line');
              const val = el.value || '';
              div.className = el.className;
              div.textContent = val;
              div.style.cssText = [
                'display:block',
                'width:100%',
                'max-width:100%',
                'box-sizing:border-box',
                'background:transparent',
                'font-family:Montserrat,sans-serif',
                'font-size:12.5px',
                'line-height:18px',
                'color:' + (isWhite ? '#ffffff' : '#0B2E6D'),
                'border:none',
                'border-bottom:1.5px solid ' + (isWhite ? '#ffffff' : '#0B2E6D'),
                'padding:2px 4px 6px 4px',
                'margin:0',
                'min-height:22px',
                'white-space:pre-wrap',
                'word-wrap:break-word',
                'overflow-wrap:anywhere',
                'word-break:break-word',
                'overflow:visible',
                'height:auto'
              ].join(';');
              el.parentNode.replaceChild(div, el);
            });

            doc.querySelectorAll('.no-print, .toolbar, .upload-btn, .img-controls, .resize-handle')
              .forEach((el) => {
                el.style.display = 'none';
              });
            doc.querySelectorAll('.quote-clip').forEach((el) => {
              el.style.clipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
              el.style.webkitClipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
              el.style.backgroundColor = '#0B2E6D';
            });
            doc.querySelectorAll('.tab-clip').forEach((el) => {
              el.style.clipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
              el.style.webkitClipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
            });
            doc.querySelectorAll('.thanks-clip').forEach((el) => {
              el.style.clipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
              el.style.webkitClipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
            });
            doc.querySelectorAll('.quote-deco-line span').forEach((el) => {
              el.style.backgroundColor = '#ffffff';
              el.style.background = '#ffffff';
            });
            doc.querySelectorAll('h2').forEach((el) => {
              el.style.textDecoration = 'none';
              el.style.borderBottom = 'none';
              el.style.boxShadow = 'none';
            });
            doc.querySelectorAll('td').forEach((el) => {
              el.style.overflow = 'visible';
              el.style.wordBreak = 'break-word';
              el.style.overflowWrap = 'anywhere';
            });
          }
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.98);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4',
          compress: true
        });

        const pageW = 210;
        const pageH = 297;
        const margin = 1.5;
        const maxW = pageW - margin * 2;
        const maxH = pageH - margin * 2;
        const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
        const imgW = canvas.width * ratio;
        const imgH = canvas.height * ratio;
        const x = (pageW - imgW) / 2;
        const y = margin;

        pdf.addImage(imgData, 'JPEG', x, y, imgW, imgH, undefined, 'MEDIUM');

        const titleEl = sheet.querySelector('h2');
        const name = (titleEl && titleEl.textContent) || 'Quotation';
        pdf.save(name.trim().replace(/\s+/g, '_') + '.pdf');
      } catch (err) {
        console.error(err);
        alert('PDF generation failed. Please try again.');
      } finally {
        if (scaleEl) scaleEl.style.transform = prevTransform;
        touched.forEach(({ el, overflow, overflowX, overflowY }) => {
          el.style.overflow = overflow;
          el.style.overflowX = overflowX;
          el.style.overflowY = overflowY;
        });
        document.body.classList.remove('pdf-exporting');
        btn.disabled = false;
        btn.textContent = 'Download PDF';
      }
    };
    document.getElementById('btn-clear-storage').onclick = () => {
      localStorage.removeItem(STORAGE_FIELDS);
      localStorage.removeItem(STORAGE_ITEMS);
      localStorage.removeItem(STORAGE_DOCTYPE);
      localStorage.removeItem(STORAGE_SIG);
      localStorage.removeItem(STORAGE_STAMP);
      localStorage.removeItem(STORAGE_LOGO);
      // Reset fields and items to defaults
      setFields({ ...defaultFields });
      setItems(defaultLineItems);
    };
  }, []);

  return (
    <div className="sheet-wrap min-h-full w-full">
      <div className="sheet-scale">
        <main className="sheet flex flex-col overflow-hidden border border-navy/20 shadow-sheet">
          <QuotationHeader fields={fields} setField={setField} docType={docType} setDocType={setDocType} />
          <DetailsSection fields={fields} setField={setField} />
          <ScopeOfWork />
          <ItemsTable fields={fields} setField={setField} items={items} setItems={setItems} />
          <TermsAndSignature fields={fields} setField={setField} />
          <FooterBar />
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
