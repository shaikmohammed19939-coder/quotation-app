function Editor({ quotationId, onExitToHome, pendingShare, onConsumePendingShare }) {
  // All default fields are empty strings – no pre-filled data, except date
  // which defaults to today so the user doesn't have to type it every time.
  const defaultFields = {
    quotationNo: '',
    date: todayDMY(),
    clientName: '',
    siteAddress: '',
    contactNo: '',
    emailId: '',
    workDescription: '',
    total: '',
    receivedAmount: '',
    sigName: '',
    sigMobile: '',
    styles: {}
  };
  const defaultImages = { logo: null, signature: null, stamp: null };
  const defaultTextDefaults = { font: '"Montserrat", Arial, sans-serif', size: 12, color: '#0B2E6D', align: 'left' };

  const [fields, setFieldsRaw] = useState({ ...defaultFields });
  const [items, setItemsRaw] = useState(defaultLineItems);
  const [docType, setDocTypeRaw] = useState('quotation');
  const [category, setCategoryRaw] = useState('waterproofing');
  const [images, setImagesRaw] = useState({ ...defaultImages });
  const [tableSettings, setTableSettingsRaw] = useState({ ...DEFAULT_TABLE_SETTINGS });
  const [defaults, setDefaultsRaw] = useState({ ...defaultTextDefaults });
  const [appearance, setAppearance] = useState({ dark: false, theme: 'navy' });

  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfError, setPdfError] = useState('');
  const [canUndo, setCanUndo] = useState(false);
  const [canRedo, setCanRedo] = useState(false);
  const [pdfPromptOpen, setPdfPromptOpen] = useState(false);
  const [pdfPromptMode, setPdfPromptMode] = useState('download');
  const [pdfNameDraft, setPdfNameDraft] = useState('');
  const [layoutEditEnabled, setLayoutEditEnabled] = useState(false);
  const [layout, setLayoutRaw] = useState({});
  const [companyProfile, setCompanyProfile] = useState({ ...DEFAULT_COMPANY });

  const pdfBlobRef = useRef(null);
  const pdfNameRef = useRef('Quotation.pdf');
  const saveTimerRef = useRef(null);
  const settingsOpenRef = useRef(false);
  const stateRef = useRef(null);
  const docCreatedAtRef = useRef(Date.now());

  useEffect(() => { settingsOpenRef.current = settingsOpen; }, [settingsOpen]);
  useEffect(() => { stateRef.current = { fields, items, docType, category, images, tableSettings, layout }; });

  /* ---------------- Undo / redo history ---------------- */
  const historyRef = useRef({ past: [], future: [] });
  const pendingBaselineRef = useRef(null);
  const debounceTimerRef = useRef(null);

  // Reads from stateRef (kept current by the effect above) rather than
  // closing over fields/items/etc directly, so functions built on top of
  // this (beginTypingEdit, commitDiscreteAction) stay correct even when
  // called from a memoized/stale closure — they always see the latest
  // document state, never a snapshot frozen at whatever render defined them.
  const snapshotDoc = () => ({ ...stateRef.current });

  const applySnapshot = (snap) => {
    setFieldsRaw(snap.fields);
    setItemsRaw(snap.items);
    setDocTypeRaw(snap.docType);
    setImagesRaw(snap.images);
    setTableSettingsRaw(snap.tableSettings);
  };

  const pushHistoryNow = (prevSnap) => {
    const h = historyRef.current;
    h.past.push(prevSnap);
    if (h.past.length > 80) h.past.shift();
    h.future = [];
    setCanUndo(true);
    setCanRedo(false);
  };

  const flushPendingBurst = () => {
    if (debounceTimerRef.current) { clearTimeout(debounceTimerRef.current); debounceTimerRef.current = null; }
    if (pendingBaselineRef.current) {
      pushHistoryNow(pendingBaselineRef.current);
      pendingBaselineRef.current = null;
    }
  };

  const beginTypingEdit = () => {
    if (!pendingBaselineRef.current) pendingBaselineRef.current = snapshotDoc();
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    debounceTimerRef.current = setTimeout(flushPendingBurst, 700);
  };

  const commitDiscreteAction = () => {
    flushPendingBurst();
    pushHistoryNow(snapshotDoc());
  };

  const undo = () => {
    flushPendingBurst();
    const h = historyRef.current;
    if (!h.past.length) return;
    const prev = h.past.pop();
    h.future.push(snapshotDoc());
    if (h.future.length > 80) h.future.shift();
    applySnapshot(prev);
    setCanUndo(h.past.length > 0);
    setCanRedo(true);
  };

  const redo = () => {
    const h = historyRef.current;
    if (!h.future.length) return;
    const next = h.future.pop();
    h.past.push(snapshotDoc());
    applySnapshot(next);
    setCanUndo(true);
    setCanRedo(h.future.length > 0);
  };

  /* ---------------- Field / doc-type / image setters ---------------- */
  const setField = (key, val) => {
    beginTypingEdit();
    setFieldsRaw((prev) => ({ ...prev, [key]: val }));
  };

  // Merges a text-format patch onto the field's existing style using the
  // latest state inside the updater (see updateItemStyle above for why).
  // Pass patch = null to clear the style entirely (Reset).
  const setFieldStyle = (key, patch) => {
    beginTypingEdit();
    setFieldsRaw((prev) => {
      const prevStyles = prev.styles || {};
      const nextVal = patch === null ? null : { ...(prevStyles[key] || {}), ...patch };
      return { ...prev, styles: { ...prevStyles, [key]: nextVal } };
    });
  };

  const setDocType = (t) => {
    commitDiscreteAction();
    setDocTypeRaw(t);
  };

  const makeImageSetter = (key) => (val) => {
    beginTypingEdit();
    setImagesRaw((prev) => ({ ...prev, [key]: val }));
  };
  const setLogo = makeImageSetter('logo');
  const setSignature = makeImageSetter('signature');
  const setStamp = makeImageSetter('stamp');

  const updateTableSetting = (key, val) => {
    commitDiscreteAction();
    setTableSettingsRaw((prev) => ({ ...prev, [key]: val }));
  };

  /* ---------------- Layout Edit Mode (drag-to-reposition sections) ----------------
     Positions persist with the document (and so carry into the PDF, which
     captures the live DOM) but are intentionally kept out of the main
     Undo/Redo history to keep dragging responsive — use "Reset Layout" to
     undo a repositioning pass. */
  const setLayoutPos = (id, pos) => {
    setLayoutRaw((prev) => ({ ...prev, [id]: pos }));
  };
  // Takes the layout value explicitly (rather than reading the `layout`
  // closure) so callers that just called setLayoutRaw synchronously — like
  // resetLayout — persist the value they intended, not a stale pre-update
  // snapshot from before React re-renders.
  const persistLayout = (layoutValue) => {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const doc = { fields, items, docType, category, images, tableSettings, layout: layoutValue, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
      await idbSet(quotationDocKey(quotationId), doc);
      await upsertIndexEntry(quotationId, doc);
      setSaveStatus('saved');
      setLastSavedAt(Date.now());
    }, 400);
  };
  const handleLayoutMoveEnd = () => persistLayout(layout);
  const resetLayout = () => { setLayoutRaw({}); persistLayout({}); };

  /* ---------------- Row management ----------------
     Wrapped in useCallback with empty deps so their identity is stable
     across renders (they read state only via the functional setState form
     or via stateRef, never by closing over fields/items directly) — this
     lets ItemsTable's rows be memoized so editing one row of a 600-row
     quotation doesn't re-render the other 599. */
  const updateItem = useCallback((id, key, val) => {
    beginTypingEdit();
    setItemsRaw((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [key]: val };
      if (key === 'qty' || key === 'rate') {
        const q = parseFloat(String(next.qty).replace(/,/g, ''));
        const r = parseFloat(String(next.rate).replace(/,/g, ''));
        if (isFinite(q) && isFinite(r)) next.amount = String(Math.round(q * r * 100) / 100);
      }
      return next;
    }));
  }, []);

  // Merges a text-format patch (e.g. {bold: true}) onto the item's existing
  // style using the latest state inside the updater, not a value snapshot
  // from render — two format clicks made close together (before React has
  // re-rendered from the first) would otherwise each merge onto the same
  // stale style object and silently drop one of the changes. Pass patch =
  // null to clear the style entirely (Reset).
  const updateItemStyle = useCallback((id, styleKey, patch) => {
    beginTypingEdit();
    setItemsRaw((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      if (patch === null) return { ...it, [styleKey]: null };
      return { ...it, [styleKey]: { ...(it[styleKey] || {}), ...patch } };
    }));
  }, []);

  const addRow = useCallback(() => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const nextId = prev.length ? Math.max(...prev.map((p) => p.id)) + 1 : 1;
      return [...prev, { id: nextId, description: '', unit: '', qty: '', rate: '', amount: '' }];
    });
  }, []);

  const removeRow = useCallback((id) => {
    commitDiscreteAction();
    setItemsRaw((prev) => (prev.length <= 1 ? prev : prev.filter((it) => it.id !== id)));
  }, []);

  const duplicateRow = useCallback((id) => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const idx = prev.findIndex((it) => it.id === id);
      if (idx === -1) return prev;
      const nextId = Math.max(...prev.map((p) => p.id)) + 1;
      const copy = { ...prev[idx], id: nextId };
      const next = [...prev];
      next.splice(idx + 1, 0, copy);
      return next;
    });
  }, []);

  const moveRow = useCallback((id, dir) => {
    commitDiscreteAction();
    setItemsRaw((prev) => {
      const idx = prev.findIndex((it) => it.id === id);
      const newIdx = idx + dir;
      if (idx === -1 || newIdx < 0 || newIdx >= prev.length) return prev;
      const next = [...prev];
      const [moved] = next.splice(idx, 1);
      next.splice(newIdx, 0, moved);
      return next;
    });
  }, []);

  const resetAll = async () => {
    if (!window.confirm('Clear this quotation and start it blank again?')) return;
    commitDiscreteAction();
    setFieldsRaw({ ...defaultFields });
    setItemsRaw(defaultLineItems);
    setDocTypeRaw('quotation');
    setImagesRaw({ ...defaultImages });
    setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS });
    setLayoutRaw({});
    const doc = {
      fields: defaultFields, items: defaultLineItems, docType: 'quotation', category,
      images: defaultImages, tableSettings: DEFAULT_TABLE_SETTINGS, layout: {},
      updatedAt: Date.now(), createdAt: docCreatedAtRef.current
    };
    await idbSet(quotationDocKey(quotationId), doc);
    await upsertIndexEntry(quotationId, doc);
  };

  /* ---------------- Auto total (Qty × Rate sum, Indian formatting) ----------------
     Total Amount is always the sum of every row's Amount — never manually
     typed — so it's guaranteed to stay in sync with the table. */
  useEffect(() => {
    const sum = items.reduce((acc, it) => acc + (parseFloat(String(it.amount).replace(/,/g, '')) || 0), 0);
    const formatted = sum ? formatINR(sum) : '';
    setFieldsRaw((prev) => (prev.total === formatted ? prev : { ...prev, total: formatted }));
  }, [items]);

  /* ---------------- Load this quotation from IndexedDB ---------------- */
  useEffect(() => {
    let cancelled = false;
    setLoaded(false);
    (async () => {
      const doc = await idbGet(quotationDocKey(quotationId));
      if (cancelled) return;
      docCreatedAtRef.current = (doc && doc.createdAt) || Date.now();
      if (doc) {
        setFieldsRaw({ ...defaultFields, ...doc.fields });
        setItemsRaw((doc.items && doc.items.length) ? doc.items : defaultLineItems);
        setDocTypeRaw(doc.docType || 'quotation');
        setCategoryRaw(doc.category || 'waterproofing');
        setImagesRaw({ ...defaultImages, ...(doc.images || {}) });
        setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS, ...(doc.tableSettings || {}) });
        setLayoutRaw(doc.layout || {});
      } else {
        setFieldsRaw({ ...defaultFields });
        setItemsRaw(defaultLineItems);
        setDocTypeRaw('quotation');
        setImagesRaw({ ...defaultImages });
        setTableSettingsRaw({ ...DEFAULT_TABLE_SETTINGS });
        setLayoutRaw({});
      }
      const prefs = (await idbGet(PREFS_KEY)) || loadJSON(PREFS_KEY, null);
      if (!cancelled && prefs) {
        if (prefs.defaults) setDefaultsRaw((d) => ({ ...d, ...prefs.defaults }));
        if (prefs.appearance) setAppearance((a) => ({ ...a, ...prefs.appearance }));
      }
      const savedCompany = await idbGet(COMPANY_PROFILE_KEY);
      if (!cancelled && savedCompany) setCompanyProfile((c) => ({ ...c, ...savedCompany }));
      historyRef.current = { past: [], future: [] };
      pendingBaselineRef.current = null;
      setCanUndo(false);
      setCanRedo(false);
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [quotationId]);

  useEffect(() => {
    if (!loaded || !pendingShare) return;
    onConsumePendingShare();
    handleShare();
    // eslint-disable-next-line
  }, [loaded]);

  /* ---------------- Autosave (debounced) ---------------- */
  useEffect(() => {
    if (!loaded) return;
    setSaveStatus('saving');
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const doc = { fields, items, docType, category, images, tableSettings, layout, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
      await idbSet(quotationDocKey(quotationId), doc);
      await upsertIndexEntry(quotationId, doc);
      setSaveStatus('saved');
      setLastSavedAt(Date.now());
    }, 600);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [fields, items, docType, images, tableSettings, loaded, quotationId]);

  useEffect(() => {
    if (!loaded) return;
    idbSet(PREFS_KEY, { defaults, appearance });
    saveJSON(PREFS_KEY, { defaults, appearance });
  }, [defaults, appearance, loaded]);

  useEffect(() => {
    document.body.classList.toggle('dark-theme', !!appearance.dark);
  }, [appearance.dark]);

  useEffect(() => {
    applyAppTheme(appearance.theme);
  }, [appearance.theme]);

  const flushSaveNow = () => {
    if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
    const s = stateRef.current;
    if (!s) return;
    const doc = { fields: s.fields, items: s.items, docType: s.docType, category: s.category, images: s.images, tableSettings: s.tableSettings, layout: s.layout, updatedAt: Date.now(), createdAt: docCreatedAtRef.current };
    idbSet(quotationDocKey(quotationId), doc);
    upsertIndexEntry(quotationId, doc);
    try {
      localStorage.setItem(quotationDocKey(quotationId) + '_light', JSON.stringify({ fields: s.fields, docType: s.docType, updatedAt: Date.now() }));
    } catch {}
  };

  const handleSaveNow = async () => {
    setSaveStatus('saving');
    flushSaveNow();
    await new Promise((r) => setTimeout(r, 260));
    setSaveStatus('saved');
    setLastSavedAt(Date.now());
  };

  /* ---------------- Exit protection: beforeunload / visibility / Android back ---------------- */
  useEffect(() => {
    const onBeforeUnload = () => flushSaveNow();
    const onVis = () => { if (document.hidden) flushSaveNow(); };
    window.addEventListener('beforeunload', onBeforeUnload);
    document.addEventListener('visibilitychange', onVis);

    try { window.history.pushState({ qGuard: true }, ''); } catch {}
    const onPop = () => {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
        active.blur();
        try { window.history.pushState({ qGuard: true }, ''); } catch {}
        return;
      }
      if (settingsOpenRef.current) {
        setSettingsOpen(false);
        try { window.history.pushState({ qGuard: true }, ''); } catch {}
        return;
      }
      flushSaveNow();
      onExitToHome();
    };
    window.addEventListener('popstate', onPop);

    return () => {
      window.removeEventListener('beforeunload', onBeforeUnload);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('popstate', onPop);
    };
  }, []);

  /* ---------------- Keyboard-avoidance: scroll focused field into view ---------------- */
  useEffect(() => {
    const onFocusIn = (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
        setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch {} }, 300);
      }
    };
    document.addEventListener('focusin', onFocusIn);
    return () => document.removeEventListener('focusin', onFocusIn);
  }, []);

  const handleBackTap = () => {
    flushSaveNow();
    onExitToHome();
  };

  /* ---------------- PDF generation (multi-page) + Share ---------------- */
  const generatePdf = async () => {
    const sheet = document.querySelector('.sheet');
    if (!sheet || !window.html2canvas || !window.jspdf) {
      setPdfError('PDF engine could not load. Check your connection and try again.');
      return null;
    }
    setPdfBusy(true);
    setPdfError('');
    document.body.classList.add('pdf-exporting');

    const scaleEl = document.querySelector('.sheet-scale');
    const prevZoom = scaleEl ? scaleEl.style.zoom : '';
    if (scaleEl) scaleEl.style.zoom = '1';

    const touched = [];
    const clearClip = (el) => {
      if (!el) return;
      touched.push({ el, overflow: el.style.overflow, overflowX: el.style.overflowX, overflowY: el.style.overflowY });
      el.style.overflow = 'visible';
      el.style.overflowX = 'visible';
      el.style.overflowY = 'visible';
    };
    clearClip(sheet);
    sheet.querySelectorAll('*').forEach((el) => {
      const cs = window.getComputedStyle(el);
      if (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.overflowY === 'hidden') clearClip(el);
    });

    try {
      sheet.querySelectorAll('textarea.edit-line').forEach((el) => {
        el.style.height = 'auto';
        el.style.height = Math.max(22, el.scrollHeight) + 'px';
        el.style.overflow = 'visible';
      });
      await new Promise((r) => setTimeout(r, 100));

      const CANVAS_SCALE = 2.5;
      const sheetRectCss = sheet.getBoundingClientRect();
      const sheetWidthCss = Math.ceil(sheetRectCss.width);
      const sheetHeightCss = Math.ceil(sheet.scrollHeight);

      // Page breaks must never fall in the middle of a table row — a
      // straight fixed-height slice can cut through a row's bottom border
      // (or its content), and since each page is an independent raster
      // crop, that border/content is then gone from BOTH pages rather than
      // duplicated onto either. Record every visible table row's bottom
      // edge (relative to the sheet) as a safe place to end a page; the
      // pagination loop below snaps each page's cutoff to the nearest one
      // of these at or before its naive height limit, so a row (and its
      // borders) always lands whole on one page.
      const rowBreakPointsCss = Array.from(sheet.querySelectorAll('table tr'))
        .filter((tr) => window.getComputedStyle(tr).display !== 'none')
        .map((tr) => tr.getBoundingClientRect().bottom - sheetRectCss.top)
        .filter((y) => y > 0 && y <= sheetHeightCss)
        .sort((a, b) => a - b);

      // html2canvas re-clones the whole document into a fresh offscreen
      // iframe on every single call, and different clones can render the
      // same layout with tiny (sub-few-px) differences — so a footer
      // boundary measured once from the LIVE page can drift out of sync
      // with what a LATER, separately-cloned capture actually rasterizes,
      // letting a sliver of the footer bleed into the "body" region (or
      // vice versa). To stay pixel-consistent, each capture below
      // re-measures the footer's position from its OWN clone (in onclone,
      // relative to that same clone's .sheet) and we crop using that.
      let clonedFooterTopCss = null;
      let clonedFooterBottomCss = null;

      // Capture the document in per-page bands rather than one giant canvas.
      // A single html2canvas call spanning hundreds of rows can exceed the
      // browser's canvas raster limits and silently return blank/corrupted
      // image data (no error thrown) — tiling keeps every captured canvas
      // at most one A4 page tall regardless of how long the document is.
      const captureBand = (yCss, hCss) => html2canvas(sheet, {
        scale: CANVAS_SCALE,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        scrollX: 0,
        scrollY: -window.scrollY,
        x: 0,
        y: yCss,
        width: sheetWidthCss,
        height: Math.max(1, Math.ceil(hCss)),
        onclone: async (doc) => {
          const clonedSheet = doc.querySelector('.sheet');
          if (clonedSheet) {
            clonedSheet.style.overflow = 'visible';
            clonedSheet.style.boxShadow = 'none';
            clonedSheet.style.border = 'none';
            clonedSheet.style.transform = 'none';
          }
          const scaleClone = doc.querySelector('.sheet-scale');
          if (scaleClone) scaleClone.style.zoom = '1';

          doc.querySelectorAll('textarea.edit-line, input.edit-line').forEach((el) => {
            const div = doc.createElement('div');
            const isWhite = el.classList.contains('white-line');
            const isNowrap = el.classList.contains('amt-nowrap');
            const noUnderline = el.classList.contains('pdf-no-underline');
            const val = el.value || '';
            div.className = el.className;
            div.textContent = val;
            // Per-field custom formatting (StyledField/AlignableCell's format
            // popover) is applied to the live element as an inline style, so
            // it survives this textarea/input -> div swap automatically —
            // read it back here instead of hard-coding color/size, so the
            // PDF matches whatever the user picked on screen.
            const customColor = el.style.color || '';
            const customFontSize = el.style.fontSize || '';
            const customFontWeight = el.style.fontWeight || '';
            const customFontStyle = el.style.fontStyle || '';
            const customTextDecoration = el.style.textDecoration || '';
            const customTextAlign = el.style.textAlign || '';
            // Text color is user-customizable, but the underline stays the
            // fixed theme color regardless — same as on screen, where the
            // border-bottom's color is a plain CSS rule the `color` property
            // never touches. Keeping the two independent here too, rather
            // than tinting the underline to match a custom text color.
            const resolvedColor = customColor || (isWhite ? '#ffffff' : '#0B2E6D');
            const underlineColor = isWhite ? '#ffffff' : '#0B2E6D';
            div.style.cssText = [
              'display:block',
              isNowrap ? 'width:auto' : 'width:100%',
              isNowrap ? '' : 'max-width:100%',
              'box-sizing:border-box',
              'background:transparent',
              'font-family:Montserrat,sans-serif',
              'font-size:' + (customFontSize || (isNowrap ? '10px' : '12.5px')),
              'line-height:18px',
              'color:' + resolvedColor + ' !important',
              customFontWeight ? ('font-weight:' + customFontWeight) : '',
              customFontStyle ? ('font-style:' + customFontStyle) : '',
              customTextDecoration ? ('text-decoration:' + customTextDecoration) : '',
              customTextAlign ? ('text-align:' + customTextAlign) : '',
              'border:none',
              // !important: the body.pdf-exporting .edit-line CSS rule also
              // forces a border-bottom color on this element (it keeps the
              // 'edit-line' class after being swapped to a div above), so a
              // plain declaration here would be silently overridden by it.
              (noUnderline ? 'border-bottom:none' : ('border-bottom:1.5px solid ' + underlineColor)) + ' !important',
              'padding:2px 4px 6px 4px',
              'margin:0',
              'min-height:22px',
              isNowrap ? 'white-space:nowrap' : 'white-space:pre-wrap',
              isNowrap ? '' : 'word-wrap:break-word',
              isNowrap ? '' : 'overflow-wrap:anywhere',
              isNowrap ? '' : 'word-break:break-word',
              'overflow:visible',
              'height:auto'
            ].filter(Boolean).join(';');
            el.parentNode.replaceChild(div, el);
          });

          doc.querySelectorAll('.rich-desc').forEach((el) => {
            el.removeAttribute('data-placeholder');
            el.style.cursor = 'default';
          });

          doc.querySelectorAll('.no-print, .toolbar, .upload-btn, .img-controls, .resize-handle, .row-actions, .app-bar, .editor-toolbar, .save-status')
            .forEach((el) => { el.style.display = 'none'; });
          doc.querySelectorAll('.quote-clip').forEach((el) => {
            el.style.clipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
            el.style.webkitClipPath = 'polygon(16% 0, 100% 0, 100% 100%, 27% 100%, 0 56%)';
            el.style.backgroundColor = '#0B2E6D';
          });
          doc.querySelectorAll('.tab-clip').forEach((el) => {
            el.style.clipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
            el.style.webkitClipPath = 'polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%)';
          });
          doc.querySelectorAll('.thanks-clip').forEach((el) => {
            el.style.clipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
            el.style.webkitClipPath = 'polygon(9% 0, 100% 0, 100% 100%, 0 100%)';
          });
          doc.querySelectorAll('.quote-deco-line span').forEach((el) => {
            el.style.backgroundColor = '#ffffff';
            el.style.background = '#ffffff';
          });
          doc.querySelectorAll('h2').forEach((el) => {
            el.style.textDecoration = 'none';
            el.style.borderBottom = 'none';
            el.style.boxShadow = 'none';
          });
          doc.querySelectorAll('td').forEach((el) => {
            el.style.overflow = 'visible';
            el.style.wordBreak = 'break-word';
            el.style.overflowWrap = 'anywhere';
          });

          // html2canvas re-clones the whole document into a fresh iframe on
          // every call, so every <img> (including the large footer banner)
          // starts decoding from scratch each time. Without waiting here, a
          // capture can rasterize before the clone's image has resolved its
          // intrinsic size, momentarily rendering it collapsed/squished —
          // which then bleeds a sliver of it into whatever page is being
          // captured at that moment. html2canvas awaits an async onclone,
          // so block on every image actually finishing decode first.
          const imgs = Array.from(doc.images || []);
          await Promise.all(imgs.map((img) => {
            if (img.complete && img.naturalWidth > 0) {
              return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
            }
            return new Promise((resolve) => {
              img.addEventListener('load', () => {
                (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(resolve);
              }, { once: true });
              img.addEventListener('error', resolve, { once: true });
            });
          }));

          // Re-measure the footer's box from THIS clone (after the image
          // wait above, so layout is settled) — see the comment above
          // captureBand for why this can't just be measured once up front.
          const clonedSheetForMeasure = doc.querySelector('.sheet');
          const clonedFooterForMeasure = doc.querySelector('footer');
          if (clonedSheetForMeasure && clonedFooterForMeasure) {
            const sr = clonedSheetForMeasure.getBoundingClientRect();
            const fr = clonedFooterForMeasure.getBoundingClientRect();
            clonedFooterTopCss = fr.top - sr.top;
            clonedFooterBottomCss = fr.bottom - sr.top;
          }
        }
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });

      const pageW = 210;
      const pageH = 297;
      const margin = 1.5;
      const maxW = pageW - margin * 2;
      const maxH = pageH - margin * 2;
      const imgW = maxW;
      const pxPerMm = sheetWidthCss / pageW;

      // jsPDF leaves the margin strip around each page's image unpainted —
      // most viewers show that as white (the page's default), but some
      // (mobile dark-themed PDF viewers in particular) render unpainted
      // space using their own dark background instead. Where two pages meet
      // in a continuous-scroll view, two such unpainted margins sit right
      // next to each other and read as one thick dark bar — even though
      // every row and border above is already rendered correctly. Painting
      // every page fully white first removes any unpainted area at all, so
      // there's nothing left for a viewer's theme to show through.
      const paintPageWhite = () => {
        pdf.setFillColor(255, 255, 255);
        pdf.rect(0, 0, pageW, pageH, 'F');
      };
      paintPageWhite();

      // Slice an already-captured canvas in memory (cheap — no re-render).
      const sliceCanvas = (source, y0, y1) => {
        const c = document.createElement('canvas');
        c.width = source.width;
        c.height = y1 - y0;
        c.getContext('2d').drawImage(source, 0, y0, source.width, y1 - y0, 0, 0, source.width, y1 - y0);
        return c;
      };

      // Stack two already-captured canvas slices vertically (cheap — no
      // re-render), used to prepend a carried border strip onto a page.
      const concatCanvasesVertical = (top, bottom) => {
        const c = document.createElement('canvas');
        c.width = Math.max(top.width, bottom.width);
        c.height = top.height + bottom.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(top, 0, 0);
        ctx.drawImage(bottom, 0, top.height);
        return c;
      };

      // Paginate the body (everything above the footer) across as many real
      // A4 pages as it needs, with no shrinking. Each html2canvas capture is
      // kept well under the browser's canvas raster limits (a single capture
      // spanning hundreds of rows can silently return blank/corrupted image
      // data with no error) — but capturing one page at a time is far too
      // slow for long documents (html2canvas re-clones the whole DOM on every
      // call), so each capture batches as many pages as safely fit into one
      // raster, then those pages are split apart with cheap in-memory
      // canvas cropping instead of additional html2canvas calls.
      const pageSliceCss = Math.max(1, Math.floor(maxH * pxPerMm));
      const SAFE_TILE_CANVAS_PX = 20000;
      const pagesPerTile = Math.max(1, Math.floor(SAFE_TILE_CANVAS_PX / (CANVAS_SCALE * pageSliceCss)));
      const tileCssHeight = pagesPerTile * pageSliceCss;

      // A tile batches several pages into one html2canvas call for speed
      // (see comment above), but its band is otherwise just a fixed pixel
      // height with no idea where table rows are — if that band ends
      // mid-row, the row is missing pixels in the capture itself (not just
      // a bad crop), and no downstream slicing can recover it. Snap the
      // tile's end to the same row boundaries used for page breaks, so a
      // tile's raster band never actually clips a row.
      const TILE_MIN_ADVANCE_CSS = tileCssHeight * 0.5;
      const snapTileEnd = (fromCss, naiveEndCss) => {
        let best = null;
        for (const y of rowBreakPointsCss) {
          if (y <= fromCss + TILE_MIN_ADVANCE_CSS) continue;
          if (y > naiveEndCss) break;
          best = y;
        }
        return best;
      };
      // A row-boundary line landing exactly on a tile edge is the same
      // shared-line problem BORDER_OVERLAP_PX solves for page breaks within
      // one tile — except across tiles there's no shared canvas to crop an
      // overlap from, since each tile is a separate html2canvas capture.
      // Carry a thin strip from the bottom of one tile's canvas forward and
      // prepend it to the first page sliced from the next tile, so that
      // boundary line gets redrawn there too.
      let carryTailCanvas = null;

      let renderedY = 0;
      let pagesDrawn = 0;
      let lastSliceHmm = 0;
      let fitRatio = null;
      let footerCanvas = null;
      let footerHeightMm = 0;

      // Capture the WHOLE document (footer included) across as many tiles as
      // needed. Whichever tile's own clone reports the footer starting
      // inside it is where we cut the footer away from the trailing body
      // content — using that same tile's own measurement keeps the crop
      // pixel-consistent with what was actually rasterized into it.
      // Extra CSS px captured past an intended tile-boundary row snap, as a
      // cushion against the same live-page-vs-clone rendering drift the
      // captureBand comment already describes elsewhere. Without this, the
      // requested capture height can land a few px short of or past the
      // row's true rendered edge in THIS clone, with no way to recover
      // missing pixels afterward — the observed failure mode being a stray
      // sliver of the NEXT row bleeding onto the last page of a tile. The
      // margin is captured but deliberately not "consumed" (renderedY only
      // advances past the exact snap point), so nothing is skipped — the
      // next tile just re-captures that region cleanly from its own clone.
      const TILE_BOUNDARY_SAFETY_CSS = 24;

      while (renderedY < sheetHeightCss) {
        const naiveTileEnd = Math.min(renderedY + tileCssHeight, sheetHeightCss);
        let tileH = naiveTileEnd - renderedY;
        let tileConsumedCss = tileH;
        let tileEndedAtRowSnap = false;
        if (naiveTileEnd < sheetHeightCss) {
          const snappedTileEnd = snapTileEnd(renderedY, naiveTileEnd);
          if (snappedTileEnd !== null) {
            tileConsumedCss = snappedTileEnd - renderedY;
            tileH = tileConsumedCss + TILE_BOUNDARY_SAFETY_CSS;
            tileEndedAtRowSnap = true;
          }
        }
        tileH = Math.max(1, Math.min(tileH, sheetHeightCss - renderedY));
        const tileCanvas = await captureBand(renderedY, tileH);
        if (fitRatio === null) fitRatio = maxW / tileCanvas.width;
        const scale = tileCanvas.width / sheetWidthCss;

        let footerTopPx = null;
        let footerBottomPx = null;
        if (clonedFooterTopCss !== null) {
          const t = (clonedFooterTopCss - renderedY) * scale;
          if (t >= 0 && t < tileCanvas.height) {
            footerTopPx = Math.round(t);
            footerBottomPx = Math.min(tileCanvas.height, Math.round((clonedFooterBottomCss - renderedY) * scale));
          }
        }
        // The row-snapped boundary (excluding the safety margin above) is
        // the real edge of usable content in this tile — the margin exists
        // only to make sure the capture reaches at least that far, never to
        // be sliced into a page itself.
        const rowSnapBoundaryPx = tileEndedAtRowSnap ? Math.min(tileCanvas.height, Math.round(tileConsumedCss * scale)) : null;
        const bodyPortionPx = footerTopPx !== null ? footerTopPx : (rowSnapBoundaryPx !== null ? rowSnapBoundaryPx : tileCanvas.height);
        const hasMoreContentAfterTile = naiveTileEnd < sheetHeightCss;

        const pageSliceCanvasPx = Math.max(1, Math.round(pageSliceCss * scale));
        // A page must never end mid-row (see rowBreakPointsCss above) — snap
        // each page's naive cutoff back to the nearest row boundary at or
        // before it, as long as that still leaves a reasonably full page
        // (skip snapping when it would make an almost-empty page, or when a
        // single row is taller than one page and there's nothing to snap to).
        const minAdvancePx = Math.max(1, pageSliceCanvasPx * 0.4);
        const snapToRowBreak = (ty, naiveEnd) => {
          let best = null;
          let firstBeyond = null;
          for (const breakYCss of rowBreakPointsCss) {
            const breakCanvasY = (breakYCss - renderedY) * scale;
            if (breakCanvasY <= ty + minAdvancePx) continue;
            if (breakCanvasY <= naiveEnd) { best = breakCanvasY; continue; }
            if (firstBeyond === null && breakCanvasY <= bodyPortionPx) firstBeyond = breakCanvasY;
          }
          // A row taller than one nominal page has nothing to snap back to
          // within the page — extending forward to its real end (instead of
          // falling through to a naive mid-row cut) is the only way to keep
          // every row's border intact on a single page.
          return best !== null ? best : firstBeyond;
        };
        // Table cells use border-collapse, so the line between two rows is a
        // single shared edge — when a page break snaps to that boundary, the
        // line renders as the outgoing row's bottom border on the earlier
        // page and never gets drawn again for the incoming row's top border
        // on the next page, leaving that row looking "open" at the top. Every
        // page after the first re-captures a few extra px above its own
        // start so that shared line is redrawn there too; ty/sh bookkeeping
        // (how much NEW content each page consumes) is untouched, so this
        // never double-counts or drifts page to page.
        const BORDER_OVERLAP_PX = 6;
        let ty = 0;
        while (ty < bodyPortionPx) {
          const naiveEnd = Math.min(ty + pageSliceCanvasPx, bodyPortionPx);
          let sh = naiveEnd - ty;
          if (naiveEnd < bodyPortionPx) {
            const snapped = snapToRowBreak(ty, naiveEnd);
            if (snapped !== null) sh = Math.round(snapped) - ty;
          }
          sh = Math.max(1, Math.min(sh, bodyPortionPx - ty));
          let pageCanvas;
          if (ty === 0 && carryTailCanvas) {
            // First page of a later tile: the row-boundary line right at
            // this tile's start lives only in the PREVIOUS tile's raster
            // (this tile starts fresh from here), so stitch the carried
            // strip on top instead of cropping into this tile's own canvas.
            pageCanvas = concatCanvasesVertical(carryTailCanvas, sliceCanvas(tileCanvas, 0, ty + sh));
          } else {
            const cropStart = pagesDrawn > 0 ? Math.max(0, ty - BORDER_OVERLAP_PX) : ty;
            pageCanvas = sliceCanvas(tileCanvas, cropStart, ty + sh);
          }
          carryTailCanvas = null;
          const sliceData = pageCanvas.toDataURL('image/jpeg', 0.98);
          const sliceHmm = pageCanvas.height * fitRatio;
          if (pagesDrawn > 0) { pdf.addPage(); paintPageWhite(); }
          pdf.addImage(sliceData, 'JPEG', (pageW - imgW) / 2, margin, imgW, sliceHmm, undefined, 'MEDIUM');
          lastSliceHmm = sliceHmm;
          ty += sh;
          pagesDrawn++;
        }

        if (footerTopPx !== null && footerBottomPx > footerTopPx) {
          footerCanvas = sliceCanvas(tileCanvas, footerTopPx, footerBottomPx);
          footerHeightMm = footerCanvas.height * fitRatio;
        } else if (footerTopPx === null && hasMoreContentAfterTile) {
          // No footer in this tile, and there's still body content ahead in
          // the next tile — carry the last few px up to the real (unpadded)
          // boundary forward, so the row-boundary line straddling the two
          // tiles gets redrawn there too.
          carryTailCanvas = sliceCanvas(tileCanvas, Math.max(0, bodyPortionPx - BORDER_OVERLAP_PX), bodyPortionPx);
        }

        // Advance by the exact (unpadded) amount actually consumed, never by
        // the safety-margin-inflated capture height — otherwise the margin
        // region (which was deliberately left out of every page above) would
        // be skipped entirely instead of being re-captured by the next tile.
        renderedY += tileConsumedCss;
      }

      // Place the footer, bottom-anchored, on the last page if it fits there
      // alongside the body content already drawn — otherwise give it its own
      // fresh page (still bottom-anchored, blank space above rather than below).
      // We can't rely on CSS ("position: fixed; bottom: 0") because each
      // page is a separate raster image.
      if (footerCanvas) {
        const fitsOnLastPage = pagesDrawn > 0 && lastSliceHmm + footerHeightMm <= maxH;
        if (pagesDrawn > 0 && !fitsOnLastPage) { pdf.addPage(); paintPageWhite(); }
        const footerY = margin + maxH - footerHeightMm;
        const footerData = footerCanvas.toDataURL('image/jpeg', 0.98);
        pdf.addImage(footerData, 'JPEG', (pageW - imgW) / 2, footerY, imgW, footerHeightMm, undefined, 'MEDIUM');
      }

      const titleEl = sheet.querySelector('h2');
      const name = (titleEl && titleEl.textContent) || 'Quotation';
      const fileName = name.trim().replace(/\s+/g, '_') + '.pdf';
      const blob = pdf.output('blob');
      pdfBlobRef.current = blob;
      pdfNameRef.current = fileName;
      return { blob, fileName, pdf };
    } catch (err) {
      console.error(err);
      setPdfError('PDF generation failed. Please try again.');
      return null;
    } finally {
      if (scaleEl) scaleEl.style.zoom = prevZoom;
      touched.forEach(({ el, overflow, overflowX, overflowY }) => {
        el.style.overflow = overflow;
        el.style.overflowX = overflowX;
        el.style.overflowY = overflowY;
      });
      document.body.classList.remove('pdf-exporting');
      setPdfBusy(false);
    }
  };

  const handleDownloadPdf = async (overrideName) => {
    const result = await generatePdf();
    if (result) {
      const fname = overrideName || result.fileName;
      pdfNameRef.current = fname;
      result.pdf.save(fname);
    }
  };

  const handleShare = async (overrideName) => {
    if (!pdfBlobRef.current) await generatePdf();
    const blob = pdfBlobRef.current;
    const fileName = overrideName || pdfNameRef.current;
    if (overrideName) pdfNameRef.current = overrideName;
    if (!blob) return;
    try {
      const file = new File([blob], fileName, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
    // Fallback: no native share support — download the PDF instead.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  const defaultPdfFileName = () => {
    const fmt = defaults.pdfFormat || 'number_client';
    const parts = [];
    const wantNumber = fmt === 'number_client' || fmt === 'number';
    const wantClient = fmt === 'number_client' || fmt === 'client';
    if (wantNumber && fields.quotationNo) parts.push(('Quotation_' + fields.quotationNo).replace(/\s+/g, '_'));
    if (wantClient && fields.clientName) parts.push(fields.clientName.trim().replace(/\s+/g, '_'));
    if (!parts.length) parts.push(docType === 'bill' ? 'Bill' : 'Quotation');
    return parts.join('_');
  };

  const openPdfPrompt = (mode) => {
    setPdfPromptMode(mode);
    setPdfNameDraft(defaultPdfFileName());
    setPdfPromptOpen(true);
  };

  const confirmPdfPrompt = () => {
    const name = (pdfNameDraft || defaultPdfFileName()).trim().replace(/\.pdf$/i, '') + '.pdf';
    setPdfPromptOpen(false);
    if (pdfPromptMode === 'share') handleShare(name);
    else handleDownloadPdf(name);
  };

  return (

function DataPanel({ open, onClose }) {
  const [status, setStatus] = useState('');
  // Pre-built the moment the panel opens (not on click) so that tapping
  // "Share Backup" can call navigator.share() immediately, with no
  // IndexedDB/async work in between — Chrome requires share() to run
  // within the user gesture's activation window, and any I/O beforehand
  // risks that window expiring and share() silently failing.
  const backupFileRef = useRef(null);
  const shareFileRef = useRef(null);

  useEffect(() => {
    if (!open) { backupFileRef.current = null; shareFileRef.current = null; return; }
    let cancelled = false;
    (async () => {
      const json = await buildBackupJSON();
      if (cancelled || json === null) return;
      const date = new Date().toISOString().slice(0, 10);
      backupFileRef.current = new File([json], 'quotation_app_backup_' + date + '.json', { type: 'application/json' });
      shareFileRef.current = new File([json], 'quotation_app_backup_' + date + '.txt', { type: 'text/plain' });
    })();
    return () => { cancelled = true; };
  }, [open]);

  if (!open) return null;

  const getBackupFile = async () => backupFileRef.current || (await buildBackupFile());

  const handleBackup = async () => {
    setStatus('Preparing backup…');
    try {
      const file = await getBackupFile();
      if (!file) { setStatus('No quotations yet to back up.'); return; }
      downloadBackupFile(file);
      setStatus('Backup downloaded ✓');
    } catch (e) {
      setStatus('Backup failed. Please try again.');
    }
  };

  // Fires directly from the button's click handler, per Web Share API
  // requirements: navigator.share() must run inside the user gesture, so
  // this deliberately avoids any await before it when pre-built files are
  // already cached. Shares the .txt variant (same JSON content) because
  // Chrome's share safe-list rejects .json; falls back to downloading the
  // proper .json file on any failure other than the user cancelling.
  const handleShareBackup = async () => {
    const shareFile = shareFileRef.current || await buildBackupShareFile();
    if (!shareFile) { setStatus('No quotations yet to back up.'); return; }

    const canFileShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [shareFile] }));
    if (canFileShare) {
      try {
        await navigator.share({ title: 'PlumbWork Backup', text: 'PlumbWork Backup', files: [shareFile] });
        setStatus('Backup shared successfully ✓');
      } catch (error) {
        if (error && error.name === 'AbortError') { setStatus(''); return; }
        console.error('Backup share failed:', error);
        const file = await getBackupFile();
        downloadBackupFile(file);
        setStatus('Could not open the share sheet, so the backup was downloaded instead.');
      }
      return;
    }

    const file = await getBackupFile();
    downloadBackupFile(file);
    setStatus('File sharing is not supported on this browser. Backup downloaded instead.');
  };

  const handleRestoreFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setStatus('Restoring…');
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload || !payload.docs) throw new Error('invalid file');
        for (const id of Object.keys(payload.docs)) {
          await idbSet(quotationDocKey(id), payload.docs[id]);
        }
        await queueIndexOp(async () => {
          const existing = await loadQuotationIndex();
          const byId = {};
          existing.forEach((q) => { byId[q.id] = q; });
          for (const id of Object.keys(payload.docs)) {
            byId[id] = summarizeDoc(id, payload.docs[id]);
          }
          await saveQuotationIndex(Object.values(byId));
        });
        setStatus('Restore complete ✓ — go back to Home to see it.');
      } catch (err) {
        setStatus('That file could not be read as a backup.');
      }
    };
    reader.onerror = () => setStatus('Could not read that file.');
    reader.readAsText(file);
  };

  const handleClearAll = async () => {
    if (!window.confirm('Delete ALL quotations from this device? This cannot be undone.')) return;
    const index = await loadQuotationIndex();
    for (const q of index) await idbDelete(quotationDocKey(q.id));
    await queueIndexOp(() => saveQuotationIndex([]));
    setStatus('All quotations cleared.');
  };

  return (
    <div className="modal-overlay no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-header">
          <h3>Backup &amp; Data</h3>
          <button type="button" className="icon-btn ripple-surface" onClick={onClose} title="Close"><IconClose className="h-[18px] w-[18px]" /></button>
        </div>
        <div className="modal-body">
          <div className="settings-group">
            <h4>Backup</h4>
            <p style={{ fontSize: 12.5, color: '#667085', fontFamily: 'Montserrat, sans-serif', margin: '0 0 10px' }}>
              Download every saved quotation as a single JSON file you can keep safe or move to another device.
              A backup like this also saves automatically once a day to your Downloads folder, so your data
              survives even if the app itself is ever deleted — just restore it below after reinstalling.
              Use Share Backup to send it straight to Google Drive, Gmail, or WhatsApp instead.
            </p>
            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
              <button type="button" className="upload-btn" onClick={handleBackup}>Backup All Quotations</button>
              <button type="button" className="upload-btn" onClick={handleShareBackup}>Share Backup…</button>
            </div>
          </div>
          <div className="settings-group">
            <h4>Restore</h4>
            <p style={{ fontSize: 12.5, color: '#667085', fontFamily: 'Montserrat, sans-serif', margin: '0 0 10px' }}>
              Restore quotations from a backup file. Existing quotations with the same ID are overwritten; everything else is kept.
            </p>
            <label className="upload-btn" style={{ cursor: 'pointer' }}>
              Choose Backup File…
              <input type="file" accept="application/json" style={{ display: 'none' }} onChange={handleRestoreFile} />
            </label>
          </div>
          <div className="settings-group">
            <h4>Clear Data</h4>
            <button type="button" className="upload-btn" style={{ color: '#D32F2F' }} onClick={handleClearAll}>Delete All Quotations</button>
          </div>
          {status && <p style={{ fontSize: 12.5, color: '#0B2E6D', fontWeight: 600, fontFamily: 'Montserrat, sans-serif' }}>{status}</p>}
        </div>
      </div>
    </div>
  );
}

  useEffect(() => {

      const prefs = (await idbGet(PREFS_KEY)) || loadJSON(PREFS_KEY, null);

        if (prefs.defaults) setDefaultsRaw((d) => ({ ...d, ...prefs.defaults }));

    saveJSON(PREFS_KEY, payload);

function HomeSummaryScreen() {
  const [index, setIndex] = useState(null);

  useEffect(() => {
    (async () => {
      const list = await loadQuotationIndex();
      setIndex(list);
    })();
  }, []);

  const list = index || [];
  const totalCount = list.length;
  const quotationCount = list.filter((q) => q.docType !== 'bill').length;
  const billCount = list.filter((q) => q.docType === 'bill').length;
  const totalValue = list.reduce((sum, q) => {
    const n = Number(String(q.total || '').replace(/,/g, ''));
    return sum + (isFinite(n) ? n : 0);
  }, 0);

  return (
    <div className="home-screen">
      <div className="home-header">
        <div>
          <div className="home-title">PLUMBWORK</div>
          <div className="home-subtitle">Overview</div>
        </div>
      </div>

      {index === null ? (
        <div className="home-empty">Loading…</div>
      ) : totalCount === 0 ? (
        <div className="home-empty">
          <IconDocument className="home-empty-icon" />
          <p style={{ fontWeight: 700, color: '#1d2939', fontSize: 14, margin: '0 0 4px' }}>No Quotations Yet</p>
          <p style={{ margin: 0 }}>Go to the Plumbing or Waterproofing tab to create your first quotation.</p>
        </div>
      ) : (
        <div className="home-summary-wrap">
          <div className="summary-stat-hero">
            <div className="summary-stat-hero-value">{totalCount}</div>
            <div className="summary-stat-hero-label">TOTAL QUOTATIONS &amp; BILLS</div>
          </div>
          <div className="summary-stat-grid">
            <div className="summary-stat-card">
              <IconDocument className="summary-stat-icon" />
              <div className="summary-stat-value">{quotationCount}</div>
              <div className="summary-stat-label">QUOTATIONS</div>
            </div>
            <div className="summary-stat-card">
              <IconReceipt className="summary-stat-icon" />
              <div className="summary-stat-value">{billCount}</div>
              <div className="summary-stat-label">BILLS</div>
            </div>
            <div className="summary-stat-card summary-stat-card-wide">
              <IconWallet className="summary-stat-icon" />
              <div>
                <div className="summary-stat-value">₹{formatINR(totalValue)}</div>
                <div className="summary-stat-label">TOTAL VALUE</div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const QUOTATION_LIST_VARIANTS = {
  waterproofing: {
    title: 'WATERPROOFING',
    subtitle: 'Waterproofing quotations & bills',
    createLabel: 'New Waterproofing Quotation',
    emptyTitle: 'No Waterproofing Quotations',
    emptySubtitle: 'Create your first waterproofing quotation',
    emptyIcon: IconDropletOutline
  },
  plumbing: {
    title: 'PLUMBING',
    subtitle: 'Plumbing quotations & bills',
    createLabel: 'New Plumbing Quotation',
    emptyTitle: 'No Plumbing Quotations',
    emptySubtitle: 'Create your first plumbing quotation',
    emptyIcon: IconWrenchOutline
  }
};

function QuotationListScreen({ variant, onOpen, onCreate, onShare }) {
  const cfg = QUOTATION_LIST_VARIANTS[variant] || QUOTATION_LIST_VARIANTS.waterproofing;
  const [index, setIndex] = useState(null);
  const [search, setSearch] = useState('');
  const [deleteTarget, setDeleteTarget] = useState(null);
  const creatingRef = useRef(false);

  const refresh = async () => {
    const list = await loadQuotationIndex();
    list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    setIndex(list);
  };

  useEffect(() => { refresh(); }, []);

  const filtered = (index || []).filter((q) => {
    if ((q.category || 'waterproofing') !== variant) return false;
    const s = search.trim().toLowerCase();
    if (!s) return true;
    return (q.name || '').toLowerCase().includes(s) ||
      (q.quotationNo || '').toLowerCase().includes(s) ||
      (q.clientName || '').toLowerCase().includes(s);
  });

  // Guarded against rapid double-taps: each call genuinely mints a new
  // quotation id, so an accidental second tap before the first navigation
  // completes would otherwise create two records from one intended tap.
  const handleCreate = async () => {
    if (creatingRef.current) return;
    creatingRef.current = true;
    try {
      const id = await createNewQuotation(variant);
      onCreate(id);
    } finally {
      creatingRef.current = false;
    }
  };

  const handleDuplicate = async (id) => {
    await duplicateQuotationRecord(id);
    await refresh();
  };

  const handleDeleteConfirmed = async () => {
    if (!deleteTarget) return;
    await deleteQuotationRecord(deleteTarget);
    setDeleteTarget(null);
    await refresh();
  };

  const createLabel = cfg.createLabel;

  return (
    <div className="home-screen">
      <div className="home-header">
        <div>
          <div className="home-title">{cfg.title}</div>
          <div className="home-subtitle">{cfg.subtitle}</div>
        </div>
      </div>

      <div className="home-search-wrap">
        <div className="home-search">
          <IconSvg d="m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" className="h-[16px] w-[16px] text-slate-400" />
          <input
            type="text"
            placeholder="Search by name, number or client…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
      </div>

      {(index === null || filtered.length > 0 || search.trim()) && (
        <div className="home-create-wrap">
          <button type="button" className="home-create-btn ripple-surface" onClick={handleCreate}>
            <IconAddRow className="h-[18px] w-[18px]" />
            {createLabel}
          </button>
        </div>
      )}

      {index !== null && filtered.length > 0 && (
        <div className="home-section-label">
          {search.trim() ? `Results (${filtered.length})` : `Your Quotations (${filtered.length})`}
        </div>
      )}

      {index === null ? (
        <div className="home-empty">Loading…</div>
      ) : filtered.length === 0 ? (
        <div className="home-empty">
          <cfg.emptyIcon className="home-empty-icon" />
          {!search.trim() ? (
            <>
              <p style={{ fontWeight: 700, color: '#1d2939', fontSize: 14, margin: '0 0 4px' }}>{cfg.emptyTitle}</p>
              <p style={{ margin: '0 0 16px' }}>{cfg.emptySubtitle}</p>
              <button type="button" className="home-create-btn ripple-surface" style={{ maxWidth: 280, margin: '0 auto' }} onClick={handleCreate}>
                <IconAddRow className="h-[16px] w-[16px]" />
                {createLabel}
              </button>
            </>
          ) : (
            'No quotations match your search.'
          )}
        </div>
      ) : (
        <div className="home-card-list">
          {filtered.map((q) => (
            <QuotationCard
              key={q.id}
              q={q}
              onOpen={onOpen}
              onDuplicate={handleDuplicate}
              onDelete={(id) => setDeleteTarget(id)}
              onShare={onShare}
            />
          ))}
        </div>
      )}

      {deleteTarget && (
        <div className="modal-overlay no-print" onClick={() => setDeleteTarget(null)}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 340 }}>
            <div className="modal-header">
              <h3>Delete this quotation?</h3>
            </div>
            <div className="modal-body">
              <p style={{ fontSize: 13, color: '#333', fontFamily: 'Montserrat, sans-serif', margin: '0 0 16px' }}>
                This can't be undone.
              </p>
              <div className="modal-actions">
                <button type="button" className="modal-btn modal-btn-ghost ripple-surface" onClick={() => setDeleteTarget(null)}>Cancel</button>
                <button type="button" className="modal-btn modal-btn-danger ripple-surface" onClick={handleDeleteConfirmed}>Delete</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Root() {
  const [ready, setReady] = useState(false);
  const [activeTab, setActiveTab] = useState('home');
  const [inEditor, setInEditor] = useState(false);
  const [activeId, setActiveId] = useState(null);
  const [pendingShare, setPendingShare] = useState(false);

  useEffect(() => {
    (async () => {
      await migrateLegacyDraftIfNeeded();
      // Apply the saved app-wide appearance (colour theme + dark mode)
      // immediately on cold start, regardless of which tab is first shown —
      // Home/Waterproofing/Settings/Editor each also re-apply it reactively
      // once mounted, but without this the very first paint (before any of
      // those screens mount) would flash the default theme.
      const prefs = (await idbGet(PREFS_KEY)) || loadJSON(PREFS_KEY, null);
      if (prefs && prefs.appearance) {
        applyAppTheme(prefs.appearance.theme);
        document.body.classList.toggle('dark-theme', !!prefs.appearance.dark);
      }
      setReady(true);
      if (window.__hideSplashWhenReady) window.__hideSplashWhenReady();

      // Auto-backup: on-device storage (IndexedDB) is wiped if the app is
      // ever deleted/reinstalled, same as any app. The only way data can
      // outlive that is a file saved OUTSIDE the app's own storage — so
      // once a day, quietly export the same backup file Settings' "Backup
      // All Quotations" produces, landing it in the device's Downloads
      // folder. Fire-and-forget: never blocks startup, never breaks it.
      (async () => {
        try {
          const ONE_DAY = 24 * 60 * 60 * 1000;
          const last = await idbGet(AUTO_BACKUP_KEY);
          if (last && Date.now() - last < ONE_DAY) return;
          const did = await runQuotationBackup();
          if (did) await idbSet(AUTO_BACKUP_KEY, Date.now());
        } catch (e) {}
      })();
    })();
  }, []);

  // Returning from the editor goes back to whichever tab (Home or
  // Waterproofing) the user opened it from, not always Home.
  const exitEditor = () => { setInEditor(false); setActiveId(null); setPendingShare(false); };
  const openQuotation = (id) => { setActiveId(id); setPendingShare(false); setInEditor(true); };
  const createQuotation = (id) => { setActiveId(id); setPendingShare(false); setInEditor(true); };
  const shareQuotation = (id) => { setActiveId(id); setPendingShare(true); setInEditor(true); };

  if (!ready) return null;

  if (inEditor && activeId) {
    return (
      <Editor
        key={activeId}
        quotationId={activeId}
        onExitToHome={exitEditor}
        pendingShare={pendingShare}
        onConsumePendingShare={() => setPendingShare(false)}
      />
    );
  }

  return (
    <>
      {activeTab === 'home' && <HomeSummaryScreen />}
      {activeTab === 'plumbing' && <QuotationListScreen variant="plumbing" onOpen={openQuotation} onCreate={createQuotation} onShare={shareQuotation} />}
      {activeTab === 'waterproofing' && <QuotationListScreen variant="waterproofing" onOpen={openQuotation} onCreate={createQuotation} onShare={shareQuotation} />}
      {activeTab === 'settings' && <SettingsScreen />}
      <BottomNav activeTab={activeTab} onNavigate={setActiveTab} />
    </>
  );
}

// Last line of defence: if any component throws during render (a bug we
// didn't catch, a bad value in saved data, anything), React 18 would
// otherwise unmount the WHOLE app to a blank white screen. This catches
// that and shows a recoverable screen instead — autosave already runs
// every few seconds, so a reload loses at most the last few keystrokes,
// never the quotation itself.
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error('Caught by AppErrorBoundary:', error, info && info.componentStack);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', padding: 28,
          textAlign: 'center', fontFamily: 'Montserrat, sans-serif', background: '#eef1f7'
        }}>
          <div style={{
            width: 64, height: 64, borderRadius: 18, marginBottom: 16,
            background: 'linear-gradient(135deg, #1A56C4, #0B2E6D)',
            display: 'flex', alignItems: 'center', justifyContent: 'center'
          }}>
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
            </svg>
          </div>
          <h2 style={{ color: '#0B2E6D', margin: '0 0 8px', fontSize: 17 }}>Something went wrong</h2>
          <p style={{ color: '#64748b', fontSize: 13, margin: '0 0 22px', maxWidth: 300, lineHeight: 1.5 }}>
            Your quotations are saved automatically, so your data is safe. Tap below to reload the app.
          </p>
          <button
            type="button"
            onClick={() => window.location.reload()}
            style={{
              background: '#0B2E6D', color: '#fff', border: 'none', borderRadius: 12,
              padding: '13px 32px', fontWeight: 700, fontSize: 14, cursor: 'pointer',
              fontFamily: 'Montserrat, sans-serif'
            }}
          >
            Reload App
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppErrorBoundary><Root /></AppErrorBoundary>
);
  </script>
